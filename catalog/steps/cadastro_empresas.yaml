descricao: 'Passo do build do snapshot: cruza o cadastro de telecom da Receita (estabelecimentos, empresas, Simples) com o SICI, por operadora (matriz, estabelecimentos por situação, porte, Simples e MEI, e a presença física por município: onde há estabelecimento ativo × onde a empresa declara acessos) e por mercado (entradas e baixas de empresas de telecom por ano e UF, empresas ativas por UF e porte). Sem e-mail, telefone, rua nem CEP; empresário individual sem razão social nem nome fantasia. O `cnpj_geo` (BrasilAPI) segue como está por um ciclo.'
