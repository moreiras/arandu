# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: anatel_reclamacoes
nome: Anatel — reclamações de consumidores
tipo: bruta
ativa: true
modulo: sources.anatel_reclamacoes.collect
publicavel: true
descricao: 'Solicitações de consumidores registradas na Anatel (reclamações, denúncias, pedidos de informação...), agregadas pela própria Anatel por mês × município (IBGE) × canal × serviço × marca × assunto × problema,
  de 2015 em diante: `reclamacoes.csv` (2015 a 2020, legado) e `reclamacoes_contexto.csv` (2020 em diante). Não há texto livre nem dado de quem reclamou.'
origem:
  url: https://www.anatel.gov.br/dadosabertos/paineis_de_dados/consumidor/consumidor_reclamacoes.zip
  formato: 'ZIP com 2 CSVs (UTF-8 com BOM, separador `;`): `reclamacoes_contexto.csv` (8,3 milhões de linhas, 1,5 GB) e `reclamacoes.csv` (16 milhões, 2,7 GB); 355.770.452 bytes o zip'
  licenca: Dados Abertos Anatel
  uso_comercial: permitido
  termos: https://www.gov.br/anatel/pt-br/dados/dados-abertos
  nota: 'Endereço verificado em 2026-11-06 (HTTP 200, last-modified 2026-10-13). Termos lidos em 2026-11-02 (licença aberta, crédito à fonte). O `robots.txt` do anatel.gov.br respondeu 423 (Locked) em 2026-11-06, sem regra
    legível; uma requisição por execução, com User-Agent identificado. Leitura em fluxo (~3 min, ~310 MB de memória medidos). Os dois arquivos se sobrepõem em 2020: vale o `contexto` e o legado
    só antes do primeiro mês dele (2020-01).'
cadencia:
  fonte_atualiza: mensal
  coleta: mensal
  coleta_atual: semanal
  frescor_maximo: 45d
politica_falha: opcional
saidas:
  bruto:
  - summary/reclamacoes-AAAA-MM-DD.zip
  normalizado:
  - summary/anatel_reclamacoes.json.gz
chaves:
- ibge
- uf
campos:
- nome: marcas[]
  tipo: lista
  significado: Reclamações (tipo Reclamação) por marca × serviço × ano, com os municípios distintos. A marca é maiúscula, como o consumidor a escolheu.
  tratamento: Outros tipos de solicitação (denúncia, pedido de informação, elogio...) entram só em `por_mes`. 'NÃO LOCALIZEI A MINHA EMPRESA' e 'OUTROS' não identificam ninguém.
- nome: por_mes[] / uf[] / assuntos[] / marca_assuntos[] / marca_mensal[]
  tipo: lista
  significado: Totais nacionais por mês × serviço × tipo, por UF × serviço × ano, por assunto (só do `contexto`, de 2020 em diante, porque a taxonomia mudou) e por marca × assunto e marca × mês (últimos 3 anos).
- nome: municipios[ibge].itens[]
  tipo: lista
  significado: Reclamações por ano × serviço × marca nos últimos 3 anos da fonte, por município.
- nome: resumo / data_arquivo / sha256
  tipo: dict
  significado: Linhas e solicitações de cada arquivo, mês inicial e final, data de extração, marcas e municípios; data de modificação do arquivo na Anatel e seu hash.
limites: A fonte identifica a empresa pelo nome da marca, não pelo CNPJ. Reclamação não é prova de falha da empresa. Assuntos antes de 2020 não são comparáveis com os de depois.
retencao:
  bruto: 2 versões
  normalizado: 52 semanas
fixture: tests/fixtures/raw/anatel_reclamacoes/
etapa:
  tentativas: 3
  espera_s: 300
