# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: cetic_tic_provedores_tabelas
nome: TIC Provedores — tabelas oficiais (Cetic.br)
tipo: bruta
ativa: true
modulo: sources.cetic_tic_provedores_tabelas.collect
publicavel: true
descricao: 'Tabelas oficiais da pesquisa TIC Provedores (setor de provimento de serviços de Internet no Brasil), edição vigente: proporção, total e margens de erro por região, porte do provedor e classes de número de acessos e de clientes, em formato longo. Cobre empresas com licença SCM da Anatel que são provedoras de acesso.'
origem:
  url: https://cetic.br/pt/pesquisa/provedores/microdados/
  formato: ZIP com quatro planilhas XLSX (proporção, margem de erro, total e margem de erro do total), uma aba por indicador
  licenca: CC BY 4.0
  uso_comercial: permitido
  termos: https://creativecommons.org/licenses/by/4.0/deed.pt_BR
  nota: 'Citar "Cetic.br|NIC.br, TIC Provedores AAAA" (CC BY 4.0). Não há API nem URL estável: a página lista os links diretos da edição vigente e o coletor os descobre
    por ela. O robots.txt do cetic.br libera tudo e não pede Crawl-delay; o coletor faz 3 requisições por execução, com pausa de 2 s e User-Agent identificado.'
cadencia:
  fonte_atualiza: anual
  coleta: mensal
  coleta_atual: semanal
  frescor_maximo: 400d
politica_falha: opcional
saidas:
  bruto:
  - summary/tic_provedores_AAAA_*_xlsx_v1.0.zip
  normalizado:
  - summary/cetic_tic_provedores.json.gz
chaves:
- uf
campos:
- nome: edicao / fonte / url / sha256
  tipo: int / str
  significado: Ano da edição, citação, endereço do ZIP de origem e hash do arquivo guardado.
  tratamento: A edição é a mais recente listada na página do Cetic.br; as anteriores não ficam disponíveis ali.
- nome: tabelas[aba]
  tipo: object
  significado: Código, título, universo (a quem a pergunta se aplica) e notas de cada tabela da pesquisa.
  tratamento: O texto vem da planilha; as marcas de nota de rodapé do título são retiradas.
- nome: linhas[].proporcao / margem_proporcao
  tipo: float
  significado: Percentual da resposta dentro do recorte e a margem de erro da estimativa, em pontos percentuais.
  tratamento: Estimativa amostral publicada pelo Cetic.br; vazio quando a planilha não traz o valor (nunca zero inventado).
- nome: linhas[].total / margem_total
  tipo: float
  significado: Empresas provedoras que dão a resposta no recorte, estimados pela amostra, e a margem de erro dessa estimativa.
  tratamento: Estimativa expandida pelos pesos da pesquisa, não contagem.
- nome: linhas[].dimensao / recorte / item / resposta
  tipo: str
  significado: 'Como a linha se abre: dimensão do recorte (Total, Região, Porte do provedor, Classe de número de clientes), categoria dentro dela, item da pergunta quando a pergunta tem vários itens e a resposta.'
limites: 'Autodeclaração de uma amostra de empresas, com margem de erro; só Brasil e grandes regiões (não há UF nem empresa individual). Não identifica provedores: o cruzamento com o que o Arandurapé mede (ASN, IX.br) é por classes de porte, no 1.5.4d.'
retencao:
  normalizado: 52 semanas
fixture: tests/fixtures/raw/cetic/
pendencias:
- 'Microdados: a base pública de domicílios é a fonte `cetic_tic_domicilios_microdados`; os sob Termo de Acesso estão fora do escopo.'
etapa:
  aceita_force: true
  tentativas: 3
  espera_s: 120
