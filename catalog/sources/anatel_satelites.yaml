descricao: 'Direitos de exploração de satélite no Brasil (operadora, satélite, posição orbital, banda, tipo nacional ou estrangeiro, status e validade), constelações de órbita não geoestacionária
  (NGEO, como as de órbita baixa) e satélites em operação comercial.'
origem:
