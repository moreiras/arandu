chaves:
- cnpj
campos:
- nome: direitos[].operadora / satelite / codigo / posicao / banda / tipo / status
  tipo: str
  significado: Operadora, satélite, código do direito, posição orbital, banda, tipo (Brasileiro ou Estrangeiro) e status do direito.
- nome: direitos[].lancamento / validade / prorrogado
  tipo: data / bool
  significado: Data de lançamento, validade do direito e se foi prorrogado.
- nome: ngeo[] / operando[]
  tipo: lista
  significado: Constelações NGEO (prestadora, CNPJ, objeto comercial, órbita, planos e satélites da constelação) e satélites em operação comercial.
  tratamento: CNPJ só nas constelações NGEO (prestadora no Brasil); nos direitos não há CNPJ.
- nome: resumo / data_arquivo / sha256
  tipo: dict
  significado: Linhas lidas por tabela; data de modificação do arquivo na Anatel e seu hash.
limites: Direito concedido não é capacidade em uso nem número de assinantes. Muitas operadoras são estrangeiras e não se ligam aos grupos do SICI.
