  licenca: Dados Abertos Anatel
  uso_comercial: permitido
  termos: https://www.gov.br/anatel/pt-br/dados/dados-abertos
  nota: 'Endereço achado por padrão de nome e verificado em 2026-11-02 (HTTP 200, 49.431 bytes). Uma requisição, com User-Agent identificado.'
cadencia:
  fonte_atualiza: diaria
  coleta: mensal
