# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: cgu_ceis_cnep
nome: CGU — sanções a empresas (CEIS e CNEP), recorte de telecom
tipo: bruta
ativa: true
modulo: sources.cgu_ceis_cnep.collect
publicavel: true
descricao: 'Cadastro de Empresas Inidôneas e Suspensas (CEIS) e Cadastro Nacional de Empresas Punidas (CNEP), da CGU, no Portal da Transparência. Guarda só pessoa jurídica do universo de telecom (CNPJ básico nas outorgas,
  no SICI ou nos estabelecimentos de CNAE 61 da Receita). Por sanção: cadastro, código, categoria, datas de início, fim e publicação, abrangência, órgão sancionador (UF e esfera), fundamento legal, número do processo e,
  no CNEP, o valor da multa. Pessoa física (CPF) é descartada na leitura.'
origem:
  url: https://portaldatransparencia.gov.br/sancoes
  formato: ZIP diário `download-de-dados/{ceis,cnep}/AAAAMMDD` com um CSV latin-1 (`;`, aspas, cabeçalho; CEIS 24 colunas, CNEP 25); redireciona para dadosabertos-download.cgu.gov.br; sem chave
  licenca: 'Dados abertos do Governo Federal (Decreto 8.777/2016). Termo de Uso do Portal (§3, lido em 2026-11-10): o cidadão pode "visualizar e utilizar os dados disponíveis da forma que melhor lhe convier"; o termo não nomeia licença nem exige atribuição'
  uso_comercial: permitido
  termos: https://portaldatransparencia.gov.br/termos-de-uso
  nota: 'Endereço e layout conferidos em 2026-11-08 contra os arquivos reais de 2026-11-06 (CEIS 23.746 linhas, 14.588 de pessoa jurídica; CNEP 1.854 linhas). Nem todo dia tem arquivo (fim de semana e atraso respondem 403,
    "AccessDenied"): o coletor volta até 10 dias. Uma requisição por cadastro por execução, com User-Agent identificado. Linguagem de evidência: registro do órgão sancionador na data do arquivo, sem adjetivo; vigência calculada no produto. Termos lidos em 2026-11-10 a partir do PDF colado pelo mantenedor (o site responde 405 com desafio anti-bot a acesso automatizado, I-012): sem restrição de uso comercial, de redistribuição, de base derivada nem de acesso automatizado; atribuição "CGU, Portal da Transparência" adotada por prática, não por exigência. Leitura do executor, não parecer jurídico. Dicionários do CEIS e do CNEP lidos em 2026-11-10 (PDF colado pelo mantenedor, colunas completas e descrições cortadas à direita): 24 colunas no CEIS e 25 no CNEP, como o layout medido; campos de pessoa: TIPO DE PESSOA, CPF OU CNPJ, NOME DO SANCIONADO, NOME INFORMADO PELO ÓRGÃO, RAZÃO SOCIAL e NOME FANTASIA (Receita) e OBSERVAÇÕES (texto livre); nenhum é guardado. Por dicionário, sanção inativada sai do CEIS e multa paga sai do CNEP: ausência no arquivo não prova que nunca houve sanção.'
