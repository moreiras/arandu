limites: Só pessoa jurídica do universo de telecom. A sanção pode já ter sido suspensa, anulada ou cumprida sem que o arquivo do dia reflita; vale a data de referência. Pode haver sanção a uma filial; o produto agrupa por raiz de CNPJ e mostra o CNPJ.
