  tipo: lista
  significado: Sanções do CNPJ (matriz ou filial) com cadastro (CEIS ou CNEP), código, categoria, início, fim, publicação, abrangência, órgão sancionador, UF e esfera, fundamento legal, processo e valor da multa (CNEP).
  tratamento: Registro do órgão sancionador, sem julgamento. A fonte usa data final 2099-12-31 para sanção sem prazo; o produto trata como "sem prazo".
- nome: arquivos / linhas_lidas / linhas_pessoa_juridica / sancoes_guardadas / cnpjs / universo_cnpjs_basicos
  tipo: dict
