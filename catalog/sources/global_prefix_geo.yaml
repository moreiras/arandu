# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: global_prefix_geo
nome: Geolocalização dos prefixos vistos nos IXPs (DB-IP City Lite)
tipo: derivada
ativa: true
modulo: sources.global_prefix_geo.enrich
publicavel: true
descricao: Para cada prefixo único visto em qualquer IXP do IX.br registra os IXPs onde apareceu, o ASN
  originador e a geolocalização DB-IP.
origem:
  url: https://download.db-ip.com/free/dbip-city-lite-{AAAA-MM}.mmdb.gz
  formato: MMDB (DB-IP City Lite, mensal)
  licenca: CC BY 4.0 (DB-IP); dados do GeoNames sob CC BY
  uso_comercial: permitido
  termos: https://db-ip.com/db/lite.php
  nota: 'Lido em 2026-10-31: "licensed under a Creative Commons Attribution 4.0 International License"; atribuição
    obrigatória, com link para db-ip.com nas páginas que exibem resultados da base ("IP Geolocation by DB-IP") e
    atribuição ao GeoNames. A cláusula que proíbe oferecer API de geolocalização vale só para a licença paga, mas o
    Arandurapé não expõe consulta por IP ou bloco. Sem chave de licença. Snapshot
    gerado com o GeoLite2 (MaxMind) guarda valores derivados dele.'
cadencia:
  fonte_atualiza: mensal
  coleta: semanal
  coleta_atual: semanal
  frescor_maximo: 8d
politica_falha: opcional
entradas:
- prefix_geo
saidas:
  normalizado:
  - summary/geo_global_prefixes.json.gz
chaves:
- prefixo
- asn
- ixp
- ponto
campos:
- nome: prefixes[prefix].ixps_seen
  tipo: list[str]
  significado: IXPs do IX.br onde o prefixo foi visto.
  publicado_em:
  - mapas_prefixos → maps/global_prefixes.geojson
- nome: prefixes[prefix].origin_asn
  tipo: int
  significado: ASN originador (do primeiro IXP em que o prefixo apareceu).
  tratamento: Se houver conflito de origem entre IXPs, vale o primeiro.
  publicado_em:
  - mapas_prefixos → maps/global_prefixes.geojson
- nome: prefixes[prefix].lat / lon / city / country / uf
  tipo: float|str
  significado: Posição segundo o DB-IP (centroide de cidade).
  publicado_em:
  - mapas_prefixos → maps/global_prefixes.geojson
- nome: geolocated / unknown
  tipo: int
  significado: Prefixos com e sem geolocalização.
limites: Mesmas limitações de prefix_geo. Depende dos normalizados por IXP (etapa bgp_ixp), por isso roda depois
  de products.bgp_routes.build.
retencao:
  normalizado: 52 semanas
fixture: tests/fixtures/raw/dbip/
pendencias:
- Ver prefix_geo.
