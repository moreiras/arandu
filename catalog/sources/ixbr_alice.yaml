# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: ixbr_alice
nome: Sessões BGP dos route servers do IX.br (Alice-LG)
tipo: bruta
ativa: true
modulo: sources.ixbr_alice.collect
publicavel: true
descricao: 'Estado de cada route server do IX.br (164 em 41 PTTs: rs1 e rs2, IPv6 e IPv4) e de cada sessão BGP dos membros, vistos pela API do
  Alice-LG do `lg.ix.br`. Por sessão, o estado, o motivo do último erro, a data da última mudança de estado, as rotas recebidas, aceitas e filtradas,
  o limite de importação e os contadores de atualização. Guarda também o dicionário de communities (rejeição, não exportar, RPKI, blackhole), um por snapshot.'
origem:
  url: https://lg.ix.br/api/v1/ (config, status, routeservers, routeservers/{id}/neighbors)
  formato: JSON (Alice-LG 6.1.0; os route servers são BIRD)
  licenca: nao_verificado
  uso_comercial: nao_verificado
  nota: API pública do Looking Glass do IX.br, sem autenticação. O robots.txt do lg.ix.br pede Crawl-delay de 1 s e não bloqueia caminhos; termos de uso
    não localizados em 2026-10-31. Coletor com User-Agent identificado (`arandurape/<versão> (+SITE_URL)`, `core/site.py`), uma requisição por vez e pausa de 1 s. Uma rodada tem 167 requisições (164 `neighbors` mais `config`, `status` e `routeservers`); medido em 2026-11-10 (164 de 164 route servers, 36.080 sessões, 174 s). Diária desde 2026-11-10 (decisão do mantenedor), para o `ixbr_alice_rotas` diário partir das sessões do dia.
cadencia:
  fonte_atualiza: continua
  coleta: diaria
  coleta_atual: diaria
  frescor_maximo: 10d
politica_falha: opcional
saidas:
  normalizado:
  - summary/rs_sessions.json.gz
  - summary/ixbr_communities.json.gz
chaves:
- ixp
- asn
campos:
- nome: rs[].estado_rotas
  tipo: str
  significado: Estado do cache de ROTAS do Alice para o route server (READY, BUSY ou ERROR), do `/status`; `rotas_atualizadas_em` é o fim da última renovação desse cache.
  tratamento: Não diz nada das sessões (o SP rs1 v4 aparece BUSY/ERROR nas rotas e tem sessões com minutos de uptime). O dado de sessão vem do `neighbors`.
- nome: rs[].vizinhos_em
  tipo: str
  significado: Instante em que o Alice atualizou o cache de vizinhos do route server (`cache_status.cached_at` da resposta do `neighbors`).
  tratamento: É o frescor das sessões. Vazio se a consulta falhou ou a resposta não traz o dado; o produto trata como incerto.
- nome: rs[].consultado
  tipo: bool
  significado: Se a consulta de `neighbors` do RS funcionou nesta rodada. Falso = sem sessões e sem zero inventado (`erro` diz o motivo).
- nome: sessoes[].estado
  tipo: str
  significado: Estado da sessão BGP no route server (up ou down).
- nome: sessoes[].last_error
  tipo: str
  significado: Último erro reportado pelo route server para a sessão (por exemplo "Hold timer expired"); vazio quando não há.
- nome: sessoes[].state_changed
  tipo: str
  significado: Data e hora (horário do route server) da última mudança de estado da sessão.
- nome: sessoes[].rotas
  tipo: object
  significado: Rotas recebidas, aceitas, filtradas e exportadas pelo route server para o membro.
- nome: sessoes[].import_limit
  tipo: int
  significado: Limite de prefixos aceitos por sessão (`receive_limit` e `import_limit` do route server).
- nome: sessoes[].descricao
  tipo: str
  significado: Nome do membro como cadastrado no route server (organização, não pessoa).
limites: 'Sessão BGP no route server não é tráfego nem relação comercial: mostra o que o IX.br enxerga naquele instante. O bruto não é guardado (derivados
  apenas); RS cujo `neighbors` falhou fica sem sessões e marcado; o READY/BUSY/ERROR do Alice é do cache de rotas, não das sessões. O Alice ainda não foi coletado em série diária.'
retencao:
  normalizado: 52 semanas
fixture: tests/fixtures/raw/ixbr_alice/
pendencias:
- Termos de uso do lg.ix.br não localizados (uso comercial).
- 'Taxa: no mínimo 1 s entre requisições, uma por vez (definido pelo mantenedor).'
etapa:
  tentativas: 2
  espera_s: 120
  memoria_mb: 320   # pico do contêiner do worker nas execuções de 2026-11-21 e 22 (amostras de 30 s) com 25% de folga; refine com `arandu memoria`
