# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: registrobr_listas
nome: Listas de numeração do Registro.br (transferências e recuperação)
tipo: bruta
ativa: true
modulo: sources.registrobr_listas.collect
publicavel: false
exposicao: nenhuma
descricao: Transferências diretas de IPv4 (com e sem bloco original) e recursos em recuperação e já recuperados, publicados pelo Registro.br. Só guardadas, comprimidas, todo dia (a origem mantém só a versão atual).
origem:
  url: https://ftp.registro.br/pub/numeracao/{transferencias-diretas-latest, transferencias-diretas-lacnic-latest, recuperacao-latest, recuperados-latest}
  formato: texto delimitado por | (Latin-1)
  licenca: nao_verificado
  uso_comercial: nao_verificado
  nota: Sem termos de uso explícitos no diretório (estudo de 2026-10-09); confirmar com o NIC.br antes de publicar derivados.
cadencia:
  fonte_atualiza: diaria
  coleta: diaria
  coleta_atual: diaria
  frescor_maximo: 3d
politica_falha: opcional
saidas:
  bruto:
  - summary/registrobr-transferencias-diretas-{as_of}.gz
  - summary/registrobr-transferencias-diretas-lacnic-{as_of}.gz
  - summary/registrobr-recuperacao-{as_of}.gz
  - summary/registrobr-recuperados-{as_of}.gz
chaves:
- prefixo
- asn
campos: []
limites: Só guarda o bruto comprimido; quem os lê é a fonte derivada `ipv4_listas`. Arquivos em Latin-1 no Registro.br.
retencao:
  bruto: 365 versões no armazém (as listas públicas só guardam a versão atual)
fixture: tests/fixtures/raw/listas_numeracao/
pendencias:
- Termos de uso das listas do Registro.br não confirmados.
armazem:
  incluir:
  - raw:summary/registrobr-transferencias-diretas-{as_of}.gz
  - raw:summary/registrobr-transferencias-diretas-lacnic-{as_of}.gz
  - raw:summary/registrobr-recuperacao-{as_of}.gz
  - raw:summary/registrobr-recuperados-{as_of}.gz
  manter_versoes: 365
