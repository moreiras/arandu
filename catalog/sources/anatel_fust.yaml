# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: anatel_fust
nome: Anatel — compromissos do FUST
tipo: bruta
ativa: true
modulo: sources.anatel_fust.collect
publicavel: true
descricao: 'Compromissos de aplicação dos recursos do Fundo de Universalização dos Serviços de Telecomunicações (FUST) registrados pela Anatel: conectividade de escolas públicas
  e de unidades básicas de saúde, redes de transporte em fibra, SMP 4G e atendimento de favelas, por município, com programa, edital, investimento previsto, prazo e situação (Atendido, A vencer,
  Em apuração). Não identifica a empresa executora.'
origem:
  url: https://www.anatel.gov.br/dadosabertos/paineis_de_dados/acompanhamento_e_controle/fust.zip
  formato: ZIP com 3 CSVs (UTF-8 com BOM, separador `;`); só `Base_FUST.csv` (41 colunas, ~21,6 mil linhas, ~9,5 MB) é lido
  licenca: Dados Abertos Anatel
  uso_comercial: permitido
  termos: https://www.gov.br/anatel/pt-br/dados/dados-abertos
  nota: 'Endereço achado por padrão de nome e verificado em 2026-11-02 (HTTP 200, 971.969 bytes). O catálogo do dados.gov.br não responde a consulta automática. O mesmo zip traz
    `Base_SEI.csv` e `Base_SIGEC.csv` (ônus contratual do STFC), que não são lidos. Uma requisição, com User-Agent identificado.'
cadencia:
  fonte_atualiza: diaria
  coleta: mensal
  coleta_atual: semanal
  frescor_maximo: 45d
politica_falha: opcional
saidas:
  bruto:
  - summary/fust-AAAA-MM-DD.zip
  normalizado:
  - summary/anatel_fust.json.gz
chaves:
- ibge
campos:
- nome: compromissos[].id / origem / tipo / programa
  tipo: str
  significado: 'Número da linha, edital ou projeto de origem (ex.: Edital nº 166/2024/MCOM, Projetos BNDES), tipo do compromisso (escolas, UBS, favelas, rede, SMP) e programa (ex.: 1.1 Conectividade para Escolas Públicas).'
  tratamento: Espaços e tabulações normalizados; os códigos de programa vêm do arquivo.
- nome: compromissos[].ibge / uf / municipio / nivel / base_ibge
  tipo: str
  significado: Município (7 primeiros dígitos de `COD_LOCALIDADE`), UF, nome, nível da obrigação (Município ou Localidade) e malha do IBGE usada (IBGE_2010 ou IBGE_2022).
  tratamento: Código de município de malha antiga pode não existir no cadastro atual do IBGE; o produto conta esses casos.
- nome: compromissos[].status / prazo / investimento
  tipo: str / data / float
  significado: Situação registrada pela Anatel (Atendido, A vencer, Em apuração), prazo máximo e investimento total previsto em reais.
  tratamento: 'Investimento é o previsto, não o desembolsado. Valor em branco vira null.'
- nome: resumo / data_arquivo / sha256
  tipo: dict
  significado: Compromissos lidos, sem município, sem valor, contagem por situação; data de modificação do arquivo na Anatel e seu hash.
limites: Não identifica a empresa executora nem o valor desembolsado. 'Em apuração' é a situação registrada pela Anatel, não inadimplência.
retencao:
  bruto: 2 versões
  normalizado: 52 semanas
fixture: tests/fixtures/raw/anatel_fust/
etapa:
  aceita_force: true
  tentativas: 3
  espera_s: 300
