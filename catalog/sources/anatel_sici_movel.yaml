# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: anatel_sici_movel
nome: Acessos de telefonia móvel (SICI/Anatel)
tipo: bruta
ativa: true
modulo: sources.anatel_sici_movel.collect
publicavel: true
descricao: Acessos móveis declarados por prestadora, município, modalidade (pré/pós), geração (2G–5G)
  e tipo de cliente. Mesma mecânica incremental do SICI fixo, com membros semestrais (~100–250 MB) e histórico
  a partir de 2019.
origem:
  url: https://www.anatel.gov.br/dadosabertos/paineis_de_dados/acessos/acessos_telefonia_movel.zip
  formato: zip/csv (~3 GB; leitura por HTTP Range)
  licenca: Dados Abertos Anatel (licença aberta, crédito à fonte)
  uso_comercial: permitido
  termos: https://www.gov.br/anatel/pt-br/dados/dados-abertos
  nota: 'Plano de Dados Abertos da Anatel (verificado em 2026-10-13): dados ''disponibilizados sob licença
    aberta que permita sua livre utilização, consumo ou cruzamento, limitando-se a creditar a autoria
    ou a fonte'' (Decreto 8.777/2016). A licença específica do conjunto em dados.gov.br não pôde ser lida
    (exige JavaScript/token).'
cadencia:
  fonte_atualiza: mensal
  coleta: diaria_se_novo_mes
  coleta_atual: semanal
  frescor_maximo: 45d
politica_falha: opcional
saidas:
  normalizado:
  - summary/sici_movel_acessos.json.gz
  - ../sici_movel_cache/state.json
  - ../sici_movel_cache/months/{AAAA-MM}.json.gz
chaves:
- cnpj
- ibge
- uf
- mes_referencia
campos:
- nome: mes_referencia
  tipo: str
  significado: Último mês de declaração disponível (AAAA-MM).
  publicado_em:
  - sici → sici_movel.json.gz#mes_referencia
- nome: cnpjs[cnpj].acessos
  tipo: int
  significado: Acessos móveis de voz/dados em linha pessoal, declarados no mês.
  tratamento: M2M e PONTO_DE_SERVICO não entram no total (batem com o total oficial da Anatel).
  publicado_em:
  - sici → sici_movel.json.gz#cnpjs
- nome: cnpjs[cnpj].acessos_m2m / acessos_outros
  tipo: int
  significado: Acessos M2M (chips embarcados) e demais (infraestrutura da prestadora), contados à parte.
  publicado_em:
  - sici → sici_movel.json.gz#cnpjs
- nome: cnpjs[cnpj].por_geracao / por_modalidade / por_produto / por_municipio
  tipo: dict
  significado: Acessos por geração (2G–5G), modalidade de cobrança, produto e município.
  publicado_em:
  - sici → sici_movel.json.gz#cnpjs
- nome: cnpjs[cnpj].pf / pj
  tipo: int
  significado: Acessos de clientes PF e PJ.
  publicado_em:
  - sici → sici_movel.json.gz#cnpjs
limites: Só formato unificado (2019 em diante). Autodeclarado. Linhas ≠ pessoas (uma pessoa pode ter várias).
retencao:
  bruto: cache incremental
  normalizado: 52 semanas
fixture: tests/fixtures/raw/anatel_sici_movel/
pendencias:
- Confirmar a licença no registro do conjunto em dados.gov.br (página exige JavaScript; API pública responde
  401).
