# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: ipv4_delegated
nome: Eventos do ciclo de vida do IPv4 (delegated-extended do LACNIC)
tipo: derivada
ativa: true
modulo: sources.ipv4_delegated.enrich
publicavel: true
descricao: 'Diff diário do `delegated-lacnic-extended` (blocos IPv4 com país, status, data e `opaque-id` da organização) em eventos observados: `titularidade` (o `opaque-id` mudou),
  `recuperacao` (allocated/assigned → reserved), `liberacao` (reserved → allocated/assigned), `novo`, `removido` e `pais`. Compara por intervalo de endereços: dividir ou juntar blocos da mesma
  organização não é evento. Lê o histórico do backfill (2020 em diante) e o bruto diário; grava os eventos em data/ipv4/eventos/ (derivado, reconstruível) e o resumo do dia no normalizado,
  com a validação cruzada contra as transferências diretas do Registro.br.'
origem:
  url: https://ftp.lacnic.net/pub/stats/lacnic/delegated-lacnic-extended-latest e archive/AAAA/
  formato: texto delimitado por | (RIR Statistics Exchange Format, extended)
  licenca: nao_verificado
  uso_comercial: nao_verificado
  termos: https://ftp.lacnic.net/pub/stats/lacnic/README
  nota: 'README do diretório (2004) não declara termos; o `opaque-id` é público no arquivo e não traz nome. Decisão do mantenedor (2026-11-02): publicar derivados; confirmar os termos com o LACNIC.
    Um evento é uma diferença observada entre duas fotos, sem causa nem intenção.'
cadencia:
  fonte_atualiza: diaria
  coleta: diaria
  coleta_atual: diaria
  frescor_maximo: 3d
politica_falha: opcional
entradas:
- lacnic_delegated
- lacnic_historico
saidas:
  normalizado:
  - summary/ipv4_delegated.json.gz
chaves:
- prefixo
- pais
campos:
- nome: ultima_foto / por_status
  tipo: str / dict
  significado: Data da última foto processada e, por status (allocated, assigned, reserved), blocos e endereços no LACNIC e no Brasil.
- nome: eventos_por_tipo / eventos_ultimos_dias
  tipo: dict / int
  significado: Eventos dos últimos 30 dias por tipo.
  tratamento: Diferença observada entre fotos diárias, sem causa nem intenção; a data é a da foto em que apareceu (`visto_entre` quando faltou uma foto).
- nome: validacao_cruzada
  tipo: dict
  significado: Das transferências diretas BR → BR do Registro.br desde 2020, quantas aparecem como mudança de `opaque-id` no `delegated` (mesmo bloco, de 3 dias antes a 45 dias depois).
- nome: processamento
  tipo: dict
  significado: Fotos processadas, eventos novos, dias sem arquivo (lacunas) e reorganizações de blocos que não são evento.
limites: 'Reserved no `delegated` não diz o motivo (recuperação, reserva técnica ou pool). A organização é só o `opaque-id` (sem nome); o nome vem das transferências e do casamento com o ASN.
  O estado e os eventos são derivados: apagar data/ipv4/ e rodar com `--backfill-desde` reconstrói.'
pendencias:
- 'Termos de uso do delegated do LACNIC não declarados; confirmar (decisão do mantenedor de 2026-11-02: publicar derivados enquanto isso).'
retencao:
  normalizado: 52 semanas
fixture: tests/fixtures/raw/ipv4_listas/
etapa:
  aceita_force: true
  tentativas: 2
  espera_s: 120
