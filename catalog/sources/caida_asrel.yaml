# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: caida_asrel
nome: Relações entre ASNs (CAIDA as-rel2)
tipo: bruta
ativa: true
modulo: sources.caida_asrel.collect
publicavel: true
descricao: Dataset serial-2 do CAIDA (algoritmo AS-Rank sobre RIBs públicas), com relações provedor-cliente e
  par-par entre ASNs, um arquivo por mês. Entra como prior e régua do produto as_relationships, nunca como
  verdade (usa os mesmos coletores que a coleta própria).
origem:
  url: https://publicdata.caida.org/datasets/as-relationships/serial-2/AAAAMMDD.as-rel2.txt.bz2
  formato: texto 'provedor|cliente|-1' e 'par|par|0|fonte' (bz2)
  licenca: CAIDA AUA (Acceptable Use Agreement), atribuição obrigatória
  uso_comercial: nao_verificado
  termos: https://www.caida.org/about/legal/aua/
  nota: 'Citação exigida: "The CAIDA AS Relationships Dataset, <período>". O arquivo bruto não é redistribuído;
    só as relações derivadas entram, rotuladas como inferidas.'
cadencia:
  fonte_atualiza: mensal
  coleta: semanal
  coleta_atual: semanal
  frescor_maximo: 45d
politica_falha: opcional
saidas:
  bruto:
  - summary/caida-asrel-{as_of}.txt.gz
  normalizado:
  - summary/caida_asrel.json.gz
chaves:
- asn
campos:
- nome: p2c[]
  tipo: list[int]
  significado: Par [provedor, cliente] segundo o CAIDA.
  tratamento: Inferência do CAIDA (AS-Rank), não contrato.
- nome: p2p[]
  tipo: list[int]
  significado: Par [menor ASN, maior ASN] em relação de peering segundo o CAIDA.
  tratamento: Inferência do CAIDA; inclui pares vistos em looking glasses de IXPs.
- nome: as_of
  tipo: str
  significado: Data do arquivo mensal usado (pode ser até um mês anterior ao snapshot).
limites: Mensal, defasado até ~1 mês; sem probabilidade; cobre ~81 mil ASNs; relações híbridas e parciais são achatadas. Contra o ASPA global tem precisão 0,90 e recall 0,52 (estudo de 2026-10-25).
fixture: tests/fixtures/raw/caida_asrel/
pendencias:
- Uso comercial do dataset não verificado (AUA).
- Confirmar que servir as relações derivadas (rotuladas como inferidas, com a atribuição) é compatível com o AUA; o arquivo bruto não é redistribuído.
etapa:
  tentativas: 3
  espera_s: 60
