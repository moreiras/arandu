# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: anatel_pdff
nome: Anatel — quadro de atribuição e destinação de faixas (PDFF)
tipo: bruta
ativa: true
modulo: sources.anatel_pdff.collect
publicavel: true
descricao: 'Plano de Destinação de Frequências de Radiocomunicação da Anatel: para cada faixa (kHz a GHz) os serviços destinados e atribuídos no Brasil, com o caráter (primário ou secundário).
  É o quadro normativo; não diz quem explora a faixa nem se ela está em uso.'
origem:
  url: https://www.anatel.gov.br/dadosabertos/paineis_de_dados/espectro_e_orbita/pdff.zip
  formato: ZIP com 8 CSVs (UTF-8 com BOM, separador `;`); `Destinacao.csv` (1.428 linhas) e `Atribuicao_BR.csv` (1.668 linhas) são lidos
  licenca: Dados Abertos Anatel
  uso_comercial: permitido
  termos: https://www.gov.br/anatel/pt-br/dados/dados-abertos
  nota: 'Endereço achado por padrão de nome e verificado em 2026-11-02 (HTTP 200, 225.508 bytes). O `ID_FREQ` não é único (a mesma faixa numérica aparece em kHz e em MHz); a chave é o par início/fim em MHz. Uma requisição, com User-Agent identificado.'
cadencia:
  fonte_atualiza: irregular
  coleta: mensal
  coleta_atual: semanal
  frescor_maximo: 90d
politica_falha: opcional
saidas:
  bruto:
  - summary/pdff-AAAA-MM-DD.zip
  normalizado:
  - summary/anatel_pdff.json.gz
chaves: []
campos:
- nome: faixas[].ini_mhz / fim_mhz
  tipo: float
  significado: Início e fim da faixa em MHz.
  tratamento: Lidos das colunas `*_MHz` (vírgula decimal).
- nome: faixas[].destinacao[] / atribuicao[]
  tipo: lista
  significado: Serviços destinados e atribuídos à faixa no Brasil, cada um com o caráter (Primário ou Secundário).
- nome: resumo / data_arquivo / sha256
  tipo: dict
  significado: Faixas lidas e quantas têm destinação e atribuição; data de modificação do arquivo na Anatel e seu hash.
limites: É norma, não licença. Não diz quem explora a faixa, nem se está em uso, nem a largura efetivamente licenciada a cada operadora.
retencao:
  bruto: 2 versões
  normalizado: 52 semanas
fixture: tests/fixtures/raw/anatel_pdff/
etapa:
  aceita_force: true
  tentativas: 3
  espera_s: 300
