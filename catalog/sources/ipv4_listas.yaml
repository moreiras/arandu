# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: ipv4_listas
nome: Listas de numeração IPv4 normalizadas (transferências, recuperação, recuperados)
tipo: derivada
ativa: true
modulo: sources.ipv4_listas.enrich
publicavel: true
descricao: 'Transferências diretas do Registro.br (com o conjunto original e a data do registro original), log de transferências do LACNIC, blocos e ASNs em recuperação e já recuperados,
  lidos do bruto do dia e normalizados: CIDR abreviado corrigido, Latin-1 decodificado, blocos e endereços somados, e a primeira data de snapshot em que cada registro apareceu
  (`primeira_vez_visto`; o que já estava na primeira data coletada leva `anterior_a_coleta`). Linha que não casa com o formato é contada, não descartada em silêncio.'
origem:
  url: https://ftp.registro.br/pub/numeracao/ e https://ftp.lacnic.net/pub/stats/lacnic/transfers/
  formato: texto delimitado por | (Latin-1, Registro.br) e JSON (LACNIC)
  licenca: nao_verificado
  uso_comercial: nao_verificado
  termos: https://ftp.lacnic.net/pub/stats/lacnic/README
  nota: 'Os diretórios não declaram termos de uso (estudo de 2026-10-09, README do LACNIC de 2004). Decisão do mantenedor (2026-11-02): publicar derivados; confirmar os termos com o NIC.br e o LACNIC
    e registrar aqui. Nome de pessoa física provável é mascarado na saída pública e no MCP (`core/ipv4_listas.py`); o normalizado guarda o nome como vem e não é servido.'
cadencia:
  fonte_atualiza: diaria
  coleta: diaria
  coleta_atual: diaria
  frescor_maximo: 3d
politica_falha: opcional
entradas:
- registrobr_listas
- lacnic_listas
saidas:
  normalizado:
  - summary/ipv4_listas.json.gz
chaves:
- prefixo
- asn
- pais
campos:
- nome: transferencias_registrobr[]
  tipo: lista
  significado: 'Transferência direta do Registro.br: data, origem e destino (nome, RIR, país), blocos CIDR, endereços, conjunto original e data do registro original (quando a lista traz), `primeira_vez_visto`.'
  tratamento: 'Nome como vem da fonte (pode ser pessoa física); a publicação mascara. Um lote de blocos na mesma data e partes aparece em várias linhas (agrupado por operação no produto).'
- nome: transferencias_lacnic[]
  tipo: lista
  significado: Transferência do log do LACNIC (todas as de IPv4 da região, não só as do Brasil), com blocos originais e transferidos.
  tratamento: Registro com endereço nulo é ignorado e contado em `resumo`.
- nome: recuperacao[] / recuperados[]
  tipo: lista
  significado: Recurso (bloco IPv6, bloco IPv4 ou ASN) em recuperação com a janela, e recurso já recuperado.
- nome: resumo
  tipo: dict
  significado: Por lista, registros lidos, linhas ignoradas, primeira data coletada e novos na data.
limites: 'As listas do Registro.br só têm a versão atual: o histórico anterior à nossa coleta (iniciada em 2026-11-01; `resumo.primeira_data_coletada`) não existe, e `primeira_vez_visto` de registros antigos é a primeira data coletada.
  O log do LACNIC tem as datas de transferência.'
pendencias:
- 'Termos de uso das listas do Registro.br e do LACNIC não declarados nos diretórios; confirmar com o NIC.br e o LACNIC (decisão do mantenedor de 2026-11-02: publicar derivados enquanto isso).'
retencao:
  normalizado: 52 semanas
fixture: tests/fixtures/raw/ipv4_listas/
etapa:
  tentativas: 2
  espera_s: 60
