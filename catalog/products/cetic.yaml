# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: cetic
nome: Pesquisas TIC do Cetic.br, tabelas oficiais
descricao: 'As tabelas oficiais das pesquisas TIC Domicílios e TIC Provedores do Cetic.br|NIC.br (edição vigente), em formato longo: proporção, total e margem de erro por
  recorte (região, área, classe social, renda, porte do provedor). Valores do Cetic.br sem alteração, com a margem de erro; estimativas amostrais, não contagens.'
modulo: products.cetic.build
entradas:
- source: cetic_tic_domicilios_tabelas
- source: cetic_tic_provedores_tabelas
- source: cetic_tic_domicilios_microdados
chaves_de_juncao:
- uf
saidas:
  publicado:
  - cetic/domicilios.json.gz
  - cetic/provedores.json.gz
  - cetic/domicilios_uf.json.gz
campos:
- nome: snapshot_date
  tipo: str
  significado: "Data do snapshot em que o artefato foi gerado."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#snapshot_date
  - cetic → cetic/provedores.json.gz#snapshot_date
  - cetic → cetic/domicilios_uf.json.gz#snapshot_date
- nome: generated_at
  tipo: str
  significado: "Instante UTC em que o artefato foi gerado."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#generated_at
  - cetic → cetic/provedores.json.gz#generated_at
  - cetic → cetic/domicilios_uf.json.gz#generated_at
- nome: coletado_em
  tipo: str
  significado: "Instante UTC em que o Arandurapé baixou e leu as tabelas do Cetic.br."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#coletado_em
  - cetic → cetic/provedores.json.gz#coletado_em
  - cetic → cetic/domicilios_uf.json.gz#coletado_em
- nome: pesquisa
  tipo: str
  significado: "Nome da pesquisa (TIC Domicílios ou TIC Provedores)."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#pesquisa
  - cetic → cetic/provedores.json.gz#pesquisa
  - cetic → cetic/domicilios_uf.json.gz#pesquisa
- nome: edicao
  tipo: int
  significado: "Ano da edição publicada pelo Cetic.br."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#edicao
  - cetic → cetic/provedores.json.gz#edicao
  - cetic → cetic/domicilios_uf.json.gz#edicao
- nome: fonte
  tipo: str
  significado: "Citação da fonte: Cetic.br|NIC.br, pesquisa e edição."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#fonte
  - cetic → cetic/provedores.json.gz#fonte
  - cetic → cetic/domicilios_uf.json.gz#fonte
- nome: licenca
  tipo: str
  significado: "Licença dos dados (CC BY 4.0, citação obrigatória)."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#licenca
  - cetic → cetic/provedores.json.gz#licenca
  - cetic → cetic/domicilios_uf.json.gz#licenca
- nome: pagina
  tipo: str
  significado: "Página do Cetic.br de onde os arquivos foram descobertos."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#pagina
  - cetic → cetic/provedores.json.gz#pagina
  - cetic → cetic/domicilios_uf.json.gz#pagina
- nome: url
  tipo: str
  significado: "Endereço do ZIP de tabelas usado."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#url
  - cetic → cetic/provedores.json.gz#url
  - cetic → cetic/domicilios_uf.json.gz#url
- nome: arquivo
  tipo: str
  significado: "Nome do arquivo ZIP de origem."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#arquivo
  - cetic → cetic/provedores.json.gz#arquivo
  - cetic → cetic/domicilios_uf.json.gz#arquivo
- nome: sha256
  tipo: str
  significado: "Hash do ZIP guardado no bruto."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#sha256
  - cetic → cetic/provedores.json.gz#sha256
  - cetic → cetic/domicilios_uf.json.gz#sha256
- nome: total_tabelas
  tipo: int
  significado: "Número de tabelas (abas) da edição."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#total_tabelas
  - cetic → cetic/provedores.json.gz#total_tabelas
  - cetic → cetic/domicilios_uf.json.gz#total_tabelas
- nome: total_linhas
  tipo: int
  significado: "Número de linhas do formato longo."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#total_linhas
  - cetic → cetic/provedores.json.gz#total_linhas
  - cetic → cetic/domicilios_uf.json.gz#total_linhas
- nome: tabelas
  tipo: dict
  significado: "Por aba: código, título, universo (a quem a pergunta se aplica) e notas."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#tabelas
  - cetic → cetic/provedores.json.gz#tabelas
  - cetic → cetic/domicilios_uf.json.gz#tabelas
- nome: linhas
  tipo: list
  significado: "Formato longo: tabela, dimensao, recorte, item, resposta, proporcao, margem_proporcao, total e margem_total. Valor do Cetic.br sem alteração; vazio onde a planilha não traz."
  publicado_em:
  - cetic → cetic/domicilios.json.gz#linhas
  - cetic → cetic/provedores.json.gz#linhas
  - cetic → cetic/domicilios_uf.json.gz#linhas
- nome: natureza
  tipo: str
  significado: "Sempre 'estimativa_arandurape': o número não é do Cetic.br, é calculado pelo Arandurapé dos microdados."
  publicado_em:
  - cetic → cetic/domicilios_uf.json.gz#natureza
- nome: domicilios_entrevistados
  tipo: int
  significado: "Domicílios entrevistados na base de microdados."
  publicado_em:
  - cetic → cetic/domicilios_uf.json.gz#domicilios_entrevistados
- nome: metodo
  tipo: dict
  significado: "Réplicas usadas (200), regra da variância, margem de 95% (1,96 × erro-padrão), amostra mínima para não suprimir (30) e limite do CV para precisão baixa (30%)."
  publicado_em:
  - cetic → cetic/domicilios_uf.json.gz#metodo
- nome: indicadores
  tipo: dict
  significado: "Por indicador (internet, computador, banda_larga_fixa): rótulo e definição pelas colunas da base."
  publicado_em:
  - cetic → cetic/domicilios_uf.json.gz#indicadores
- nome: grupos
  tipo: dict
  significado: "Brasil, 5 regiões e 27 UFs: domicílios entrevistados e estimados e, por indicador, proporção, erro-padrão, margem, CV, total e precisão; grupo com menos de 30 entrevistados traz 'suprimido'."
  publicado_em:
  - cetic → cetic/domicilios_uf.json.gz#grupos
- nome: validacao
  tipo: dict
  significado: "Comparação com as tabelas oficiais da mesma edição (A1 e A4, Brasil e regiões): maior diferença da proporção em pontos percentuais e faixa da razão margem oficial ÷ margem estimada; nulo se as tabelas não estão disponíveis."
  publicado_em:
  - cetic → cetic/domicilios_uf.json.gz#validacao
limites: 'Estimativas amostrais do Cetic.br, não contagens: cada proporção vem com a margem de erro oficial, e recortes pequenos
  têm erro grande. As definições diferem das do SICI (domicílio com acesso à Internet ou com banda larga × acesso contratado
  declarado pela prestadora) e o período de referência é o da edição da pesquisa: comparar com o SICI só com a definição e
  as duas datas explícitas. Microdados sob termo de acesso ficam fora; só o que é público para download.'
