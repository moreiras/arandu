# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: qualidade
nome: Qualidade (RQUAL) e reclamações da Anatel
descricao: Indicadores de qualidade do RQUAL (série nacional por prestadora, por UF e o último resultado de cada município) e reclamações de consumidores na Anatel (por marca, serviço, UF, município e assunto), com a ligação prestadora e marca → CNPJ (tabela curada mais nome fantasia único, rotulada) e a taxa de reclamações por mil acessos do SICI onde há volume. Medido ou declarado, com fonte e período; sem ranking nem veredito.
modulo: products.qualidade.build
entradas:
- source: anatel_rqual
- source: anatel_reclamacoes
- source: anatel_scm
- source: anatel_smp
- source: anatel_stfc
- source: anatel_seac
- source: ibge_censo_pnad
- product: sici
chaves_de_juncao:
- ibge
- cnpj
saidas:
  publicado:
  - qualidade/rqual.json.gz
  - qualidade/rqual_municipios/{UF}.json.gz
  - qualidade/reclamacoes.json.gz
  - qualidade/reclamacoes_municipios/{UF}.json.gz
campos:
- nome: rqual.nacional[] / uf[]
  tipo: lista
  significado: Por serviço × prestadora × indicador, por mês (nacional) ou por ano (UF), municípios medidos, medidas, média simples, média ponderada pelas medidas e (nacional) mediana dos municípios.
  tratamento: Só resultados numéricos; não é o desempenho da empresa para um cliente. Sem ranking.
  publicado_em:
  - qualidade → qualidade/rqual.json.gz#nacional
  - qualidade → qualidade/rqual.json.gz#uf
- nome: rqual.indicadores[] / prestadoras[] / casamento
  tipo: lista
  significado: Indicadores com unidade e valores de referência da Anatel; prestadoras cobertas com as raízes de CNPJ ligadas (casamento curada ou automático) e as que ficaram sem CNPJ.
  tratamento: Cobre só as grandes prestadoras; a ausência de uma empresa não diz nada sobre ela.
  publicado_em:
  - qualidade → qualidade/rqual.json.gz#indicadores
  - qualidade → qualidade/rqual.json.gz#prestadoras
  - qualidade → qualidade/rqual.json.gz#casamento
- nome: rqual.municipios[ibge].itens[]
  tipo: lista
  significado: O último resultado de cada serviço × prestadora × indicador no município, com mês, medidas, coletores, erro amostral, intervalo e a coluna Estatística da fonte.
  tratamento: Resultado de poucas medidas é incerto; veja o erro amostral.
  publicado_em:
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#municipios
- nome: rqual.limites / natureza / fonte / data_arquivo / leitura
  tipo: str
  significado: O que o dado é e não é, a data do arquivo na Anatel e a contagem da leitura.
  publicado_em:
  - qualidade → qualidade/rqual.json.gz#limites
  - qualidade → qualidade/rqual.json.gz#natureza
  - qualidade → qualidade/rqual.json.gz#fonte
  - qualidade → qualidade/rqual.json.gz#data_arquivo
  - qualidade → qualidade/rqual.json.gz#resumo
- nome: reclamacoes.marcas[]
  tipo: lista
  significado: Reclamações por marca × serviço × ano, municípios distintos e as raízes de CNPJ ligadas à marca (vazio = sem CNPJ).
  tratamento: A ligação é curada (config/curada_marcas_operadoras.yaml) ou automática por nome fantasia único, nunca um palpite. Reclamação não é prova de falha da empresa.
  publicado_em:
  - qualidade → qualidade/reclamacoes.json.gz#marcas
- nome: reclamacoes.taxas
  tipo: dict
  significado: Reclamações da janela de 12 meses por mil acessos do SICI (SCM e SMP), só com volume suficiente, e a regra e o mês de referência do SICI.
  tratamento: As duas bases têm períodos diferentes e a marca pode agrupar mais de um CNPJ; a regra e o motivo de cada taxa ausente acompanham o dado.
  publicado_em:
  - qualidade → qualidade/reclamacoes.json.gz#taxas
- nome: reclamacoes.por_mes[] / uf[] / assuntos[] / marca_assuntos[] / casamento
  tipo: lista
  significado: Totais nacionais por mês, por UF e por assunto, assuntos por marca nos últimos 3 anos e a cobertura da ligação marca → CNPJ (% das reclamações com CNPJ).
  publicado_em:
  - qualidade → qualidade/reclamacoes.json.gz#por_mes
  - qualidade → qualidade/reclamacoes.json.gz#uf
  - qualidade → qualidade/reclamacoes.json.gz#assuntos
  - qualidade → qualidade/reclamacoes.json.gz#marca_assuntos
  - qualidade → qualidade/reclamacoes.json.gz#casamento
- nome: reclamacoes.municipios[ibge].itens[]
  tipo: lista
  significado: Reclamações por ano × serviço × marca nos últimos 3 anos da fonte, com a população estimada do IBGE para a taxa por 100 mil habitantes.
  publicado_em:
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#municipios
- nome: reclamacoes.limites / natureza / fonte / data_arquivo / leitura
  tipo: str
  significado: O que o dado é e não é, a data do arquivo na Anatel e a contagem da leitura.
  publicado_em:
  - qualidade → qualidade/reclamacoes.json.gz#limites
  - qualidade → qualidade/reclamacoes.json.gz#natureza
  - qualidade → qualidade/reclamacoes.json.gz#fonte
  - qualidade → qualidade/reclamacoes.json.gz#data_arquivo
  - qualidade → qualidade/reclamacoes.json.gz#leitura
- nome: snapshot_date / generated_at
  tipo: str
  significado: Data do snapshot e instante em que o arquivo foi gerado.
  publicado_em:
  - qualidade → qualidade/rqual.json.gz#snapshot_date
  - qualidade → qualidade/rqual.json.gz#generated_at
  - qualidade → qualidade/reclamacoes.json.gz#snapshot_date
  - qualidade → qualidade/reclamacoes.json.gz#generated_at
- nome: municipios_uf
  tipo: dict
  significado: Índice código IBGE do município → UF, para a API achar a parte por UF dos municípios.
  publicado_em:
  - qualidade → qualidade/rqual.json.gz#municipios_uf
  - qualidade → qualidade/reclamacoes.json.gz#municipios_uf
- nome: anos / url_fonte
  tipo: lista / str
  significado: Anos com reclamações na fonte e o endereço do arquivo da Anatel.
  publicado_em:
  - qualidade → qualidade/reclamacoes.json.gz#anos
  - qualidade → qualidade/reclamacoes.json.gz#url_fonte
  - qualidade → qualidade/rqual.json.gz#url_fonte
- nome: uf / anos_municipio / fonte / natureza / data_arquivo / url_fonte / snapshot_date / generated_at
  tipo: str
  significado: Cabeçalho de cada parte por UF dos municípios (UF, anos cobertos, fonte, natureza do dado, data do arquivo na Anatel, endereço, data do snapshot e instante de geração).
  publicado_em:
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#uf
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#fonte
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#natureza
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#data_arquivo
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#url_fonte
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#snapshot_date
  - qualidade → qualidade/rqual_municipios/{UF}.json.gz#generated_at
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#uf
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#anos_municipio
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#fonte
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#natureza
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#data_arquivo
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#url_fonte
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#snapshot_date
  - qualidade → qualidade/reclamacoes_municipios/{UF}.json.gz#generated_at
