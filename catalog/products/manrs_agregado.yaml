# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: manrs_agregado
nome: Participação no MANRS (agregado)
descricao: Quantos ASNs e quantos usuários estimados do Brasil estão em organizações participantes do programa de operadores do MANRS, no total, por faixa de porte e por UF, e a prontidão média de participantes
  e não participantes (total e porte). Só agregados com a atribuição exigida; não há registro por ASN nem por organização.
modulo: products.manrs.build
entradas: []          # lê a fonte manrs_participantes (publicavel=false) só para agregar; por isso a fonte não é declarada aqui, e o teste de não vazamento cobre a saída
chaves_de_juncao:
- asn
- uf
saidas:
  publicado:
  - manrs/resumo.json.gz
campos:
- nome: brasil / por_faixa_porte / por_uf
  tipo: dict
  significado: ASNs e usuários do recorte, ASNs participantes, % dos ASNs e % dos usuários estimados do APNIC; recorte com menos de 5 participantes vem `suprimido`.
  tratamento: Comparação de prontidão (participantes × não participantes) só no total e por porte, com pelo menos 5 ASNs com índice em cada lado.
  publicado_em:
  - manrs_agregado → manrs/resumo.json.gz#brasil
  - manrs_agregado → manrs/resumo.json.gz#por_faixa_porte
  - manrs_agregado → manrs/resumo.json.gz#por_uf
- nome: atribuicao / fonte / regras / limites / natureza
  tipo: dict
  significado: A frase de atribuição exigida pelos termos, a fonte com data da medição, a regra de supressão e as limitações.
  publicado_em:
  - manrs_agregado → manrs/resumo.json.gz#atribuicao
  - manrs_agregado → manrs/resumo.json.gz#fonte
  - manrs_agregado → manrs/resumo.json.gz#regras
  - manrs_agregado → manrs/resumo.json.gz#limites
  - manrs_agregado → manrs/resumo.json.gz#natureza
- nome: snapshot_date / generated_at
  tipo: str
  significado: Data do snapshot e instante em que o arquivo foi gerado.
  publicado_em:
  - manrs_agregado → manrs/resumo.json.gz#snapshot_date
  - manrs_agregado → manrs/resumo.json.gz#generated_at
