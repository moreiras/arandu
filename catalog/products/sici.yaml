- nome: meses_disponiveis
  tipo: list[str]
  significado: Meses de declaração disponíveis (SICI móvel).
  publicado_em:
  - sici → sici_movel.json.gz#meses_disponiveis
- nome: total_acessos
  tipo: int
  significado: Total nacional de acessos no último mês.
  publicado_em:
  - sici → sici_movel.json.gz#total_acessos
- nome: total_cnpjs
  tipo: int
