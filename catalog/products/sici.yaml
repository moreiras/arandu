# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: sici
nome: Acessos SICI publicados (fixo e móvel)
descricao: Acessos por CNPJ e por município (fixo e móvel), série mensal, vínculo CNPJ↔ASN e divergência
  APNIC×Anatel.
modulo: publish.snapshot_builder
entradas:
- source: anatel_sici
- source: anatel_sici_movel
- source: registro_br
- source: apnic_pop
chaves_de_juncao:
- cnpj
- asn
- ibge
- uf
- mes_referencia
saidas:
  publicado:
  - sici.json.gz
  - sici_municipios.json.gz
  - sici_movel.json.gz
  - sici_movel_municipios.json.gz
campos:
- nome: cnpj_to_asns / asn_to_cnpj
  tipo: dict
  significado: Vínculos CNPJ↔ASN usados para ligar SICI a ASN.
  tratamento: Vêm do Registro.br; vários ASNs por CNPJ ⇒ acessos_compartilhados.
  publicado_em:
  - sici → sici.json.gz#cnpj_to_asns
- nome: cnpjs[cnpj].acessos_compartilhados / asns
  tipo: bool / list[int]
  significado: 'Verdadeiro quando o CNPJ tem mais de um ASN: não somar acessos por ASN.'
  publicado_em:
  - sici → sici.json.gz#cnpjs
- nome: divergencia[asn].classificacao / razao
  tipo: str / float
  significado: Razão acessos SICI × usuários APNIC e classe (normal, acima, abaixo, nao_comparavel).
  tratamento: Hipótese de comparação entre duas estimativas diferentes; rotular.
  publicado_em:
  - sici → sici.json.gz#divergencia
- nome: municipios[ibge].operadores / hhi / share_maior
  tipo: list / int / float
  significado: Operadoras do município, índice HHI de concentração e parcela da maior.
  tratamento: HHI sobre acessos declarados, não sobre receita.
  publicado_em:
  - sici → sici_municipios.json.gz#municipios
- nome: municipios[ibge].acessos / pf / pj / capacidade_mbps
  tipo: int / float
  significado: Acessos fixos declarados no município.
  publicado_em:
  - sici → sici_municipios.json.gz#municipios
- nome: snapshot_date
  tipo: str
  significado: Data do snapshot (AAAA-MM-DD) a que o arquivo pertence.
  publicado_em:
  - sici → sici.json.gz#snapshot_date
- nome: generated_at
  tipo: str
  significado: Instante UTC em que o arquivo foi gerado.
  publicado_em:
  - sici → sici.json.gz#generated_at
- nome: fonte
  tipo: str
  significado: URL do arquivo da Anatel de origem.
  publicado_em:
  - sici → sici.json.gz#fonte
- nome: meses_disponiveis
  tipo: list[str]
  significado: Meses de declaração disponíveis (SICI fixo).
  publicado_em:
  - sici → sici.json.gz#meses_disponiveis
- nome: total_acessos
  tipo: int
  significado: Total nacional de acessos no último mês.
  publicado_em:
  - sici → sici.json.gz#total_acessos
- nome: total_cnpjs
  tipo: int
  significado: CNPJs com acessos no último mês.
  publicado_em:
  - sici → sici.json.gz#total_cnpjs
- nome: matched_cnpjs
  tipo: int
  significado: CNPJs do SICI com ASN vinculado.
  publicado_em:
  - sici → sici.json.gz#matched_cnpjs
- nome: matched_acessos
  tipo: int
  significado: Acessos desses CNPJs.
  publicado_em:
  - sici → sici.json.gz#matched_acessos
- nome: serie_por_cnpj
  tipo: dict
  significado: 'Série mensal de acessos por CNPJ: lista de [mês, acessos, pf, pj].'
  publicado_em:
  - sici → sici.json.gz#serie_por_cnpj
- nome: serie_total
  tipo: list[dict]
  significado: Série mensal nacional (mês, acessos, CNPJs).
  publicado_em:
  - sici → sici.json.gz#serie_total
- nome: cnpj_to_asns
  tipo: dict
  significado: CNPJ → ASNs.
  publicado_em:
  - sici → sici.json.gz#cnpj_to_asns
- nome: asn_to_cnpj
  tipo: dict
  significado: ASN → CNPJ.
  publicado_em:
  - sici → sici.json.gz#asn_to_cnpj
- nome: snapshot_date
  tipo: str
  significado: Data do snapshot (AAAA-MM-DD) a que o arquivo pertence.
  publicado_em:
  - sici → sici_movel.json.gz#snapshot_date
- nome: generated_at
  tipo: str
  significado: Instante UTC em que o arquivo foi gerado.
  publicado_em:
  - sici → sici_movel.json.gz#generated_at
- nome: fonte
  tipo: str
  significado: URL do arquivo da Anatel de origem.
  publicado_em:
