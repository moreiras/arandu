- nome: serie_por_cnpj
  tipo: dict
  significado: 'Série mensal de acessos por CNPJ: lista de [mês, acessos, pf, pj].'
  publicado_em:
  - sici → sici_movel.json.gz#serie_por_cnpj
- nome: serie_total
  tipo: list[dict]
  significado: Série mensal nacional (mês, acessos, CNPJs).
  publicado_em:
  - sici → sici_movel.json.gz#serie_total
- nome: cnpj_to_asns
  tipo: dict
  significado: CNPJ → ASNs.
  publicado_em:
  - sici → sici_movel.json.gz#cnpj_to_asns
- nome: asn_to_cnpj
