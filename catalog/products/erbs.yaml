# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: erbs
nome: Estações do SMP licenciadas por município, UF e operadora
descricao: Contagem das estações do SMP licenciadas (cadastro da Anatel, 2G a 5G) por município, UF, operadora e geração, com o casamento com o IBGE e o CNPJ. É cadastro
  de licenciamento, não cobertura.
modulo: products.erbs.build
entradas:
- source: anatel_erbs
- source: ibge_censo_pnad
- source: anatel_smp
- source: anatel_sici_movel
chaves_de_juncao:
- ibge
- cnpj
saidas:
  publicado:
  - erbs/resumo.json.gz
  - erbs/grade.json.gz
campos:
- nome: municipios[ibge]
  tipo: dict
  significado: Estações licenciadas no município, quantas têm cada geração (2G a 5G), estações por operadora e por 10 mil habitantes.
  tratamento: Cadastro de licenciamento, não cobertura. Município sem estação não aparece (e pode ser atendido por vizinhos).
  publicado_em:
  - erbs → erbs/resumo.json.gz#municipios
- nome: ufs[uf]
  tipo: dict
  significado: Estações, municípios, municípios com estação e com 5G, gerações e operadoras da UF.
  publicado_em:
  - erbs → erbs/resumo.json.gz#ufs
- nome: operadoras[]
  tipo: lista
  significado: Por operadora (CNPJ quando conhecido, senão a marca), estações, municípios, UFs, gerações e tipo do 5G (SA, NSA, SA-NSA).
  tratamento: O CNPJ vem do arquivo da Anatel ou, quando em branco, da razão social nas outorgas do SMP; o que não casa fica só com a marca.
  publicado_em:
  - erbs → erbs/resumo.json.gz#operadoras
- nome: brasil / casamento
  tipo: dict
  significado: Totais do país e medidas de casamento (estações com município no IBGE, sem CNPJ, sanidade contra o SICI móvel).
  publicado_em:
  - erbs → erbs/resumo.json.gz#brasil
  - erbs → erbs/resumo.json.gz#casamento
- nome: limites / natureza / fonte / data_arquivo
  tipo: str
  significado: O que o dado é e não é, o rótulo de natureza, a fonte e a data de modificação do arquivo na Anatel.
  publicado_em:
  - erbs → erbs/resumo.json.gz#limites
  - erbs → erbs/resumo.json.gz#natureza
  - erbs → erbs/resumo.json.gz#fonte
  - erbs → erbs/resumo.json.gz#data_arquivo
- nome: grade.celulas[]
  tipo: lista
  significado: Células de ~2 km (0,02 grau) com o centro (lon, lat), o número de estações licenciadas e quantas têm 2G, 3G, 4G e 5G. Alimenta a camada "Antenas" do mapa.
  tratamento: Agregado (não são pontos de estação); estação sem posição válida fica de fora.
  publicado_em:
  - erbs → erbs/grade.json.gz#celulas
- nome: grade.colunas / passo_graus / natureza / limites
  tipo: lista / float / str
  significado: Nome das colunas de cada célula, tamanho da célula em graus, rótulo de natureza e limites do dado.
  publicado_em:
  - erbs → erbs/grade.json.gz#colunas
  - erbs → erbs/grade.json.gz#passo_graus
  - erbs → erbs/grade.json.gz#natureza
  - erbs → erbs/grade.json.gz#limites
