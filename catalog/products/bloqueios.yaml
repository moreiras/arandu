# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: bloqueios
nome: Bloqueios e interferência medidos pelo OONI, por ASN (CC BY-NC-SA 4.0)
descricao: Para cada ASN do Brasil com sondas do OONI, por teste (WhatsApp, Telegram, Signal, Facebook Messenger, Tor, Psiphon e, por amostra, Web Connectivity), quantas medições a janela tem e quantas a PRÓPRIA sonda declarou
  anômalas. Veredito da sonda, não do backend do OONI; não é prova de censura. Só célula com 10 ou mais medições; nenhum site, sonda ou ranking. Dados do OONI sob CC BY-NC-SA 4.0, com atribuição no arquivo.
modulo: products.bloqueios.build
entradas:
- source: ooni_bloqueios
- product: asn_docs
chaves_de_juncao:
- asn
saidas:
  publicado:
  - bloqueios/asns.json.gz
campos:
- nome: asns[asn].testes[teste]
  tipo: dict
  significado: Medições (`n`), anomalias declaradas pela sonda (`anomalias`, `pct_anomalia`), componentes (`partes`) e, no Tor, fração de alvos acessíveis por tipo (`alvos_acessiveis_pct`). O `webconnectivity` traz `amostra=true`.
  tratamento: Veredito da própria sonda (ooni/spec), rotulado como tal; mínimo de 10 medições na janela; viés de voluntários e de sondas; CC BY-NC-SA 4.0.
  publicado_em:
  - bloqueios → bloqueios/asns.json.gz#asns
- nome: janela / minimo_medicoes / testes / web_amostra
  tipo: dict
  significado: Primeiro e último dia agregados, mínimo por célula, resumo por teste (medições, ASNs publicados, abaixo do mínimo, critério) e o tamanho da amostra do webconnectivity.
  tratamento: Cobertura declarada para não confundir ausência de sonda com ausência de bloqueio.
  publicado_em:
  - bloqueios → bloqueios/asns.json.gz#janela
  - bloqueios → bloqueios/asns.json.gz#minimo_medicoes
  - bloqueios → bloqueios/asns.json.gz#testes
  - bloqueios → bloqueios/asns.json.gz#web_amostra
- nome: fonte / licenca / aviso / limites / coletado_em
  tipo: dict
  significado: Fonte, licença CC BY-NC-SA 4.0 e atribuição, aviso de que o veredito é da sonda, limites e instante da coleta.
  publicado_em:
  - bloqueios → bloqueios/asns.json.gz#fonte
  - bloqueios → bloqueios/asns.json.gz#licenca
  - bloqueios → bloqueios/asns.json.gz#aviso
  - bloqueios → bloqueios/asns.json.gz#limites
  - bloqueios → bloqueios/asns.json.gz#coletado_em
- nome: snapshot_date / generated_at
  tipo: str
  significado: Data do snapshot e instante UTC de geração.
  publicado_em:
  - bloqueios → bloqueios/asns.json.gz#snapshot_date
  - bloqueios → bloqueios/asns.json.gz#generated_at
