# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: decix_rs
nome: DE-CIX Rio e São Paulo nos route servers (estende os IXPs externos)
descricao: 'Por PTT do DE-CIX no Brasil (decix-sp e decix-rj): route servers e sessões BGP dos membros vistos no Alice-LG, ASNs diretos (sessão up no route server), ASNs originadores
  das rotas lidas por vizinho em rodízio (um piso, com a cobertura declarada), membros com nome do LG e cruzamento com o PeeringDB, e a comparação por cidade com o IX.br (São Paulo
  e Rio) e com o Equinix cadastrado (São Paulo). Fatos medidos no route server na data da coleta, sem veredito.'
modulo: products.decix_rs.build
entradas:
- source: decix_alice
- product: ixp_docs
- product: asn_docs
chaves_de_juncao:
- ixp
- asn
saidas:
  publicado:
  - decix_rs/ixps.json.gz
campos:
- nome: ixps[ixp].resumo
  tipo: dict
  significado: Route servers (total e consultados), sessões up e down, membros (ASNs com sessão), ASNs diretos e originadores (contagens, total e brasileiros).
  tratamento: "`asn_direct` = sessão up no route server (não é o primeiro salto do AS_PATH do IX.br); `asn_origin` é um piso (leitura parcial por vizinho)."
  publicado_em:
  - decix_rs → decix_rs/ixps.json.gz#ixps
- nome: ixps[ixp].asn_direct / asn_origin / br_asns_direct / br_asns_origin
  tipo: list
  significado: ASNs com sessão up, ASNs de origem das rotas lidas e a parte brasileira de cada conjunto.
  tratamento: Sem leitura de rotas não há originador (não é zero); `rotas.parcial` e `rotas.cobertura` dizem quanto foi lido.
  publicado_em:
  - decix_rs → decix_rs/ixps.json.gz#ixps
- nome: ixps[ixp].membros[]
  tipo: list
  significado: Por ASN, o nome do LG (organização), sessões up e down por família e rotas recebidas pelo route server.
  tratamento: Rótulo público do LG; nunca contatos.
  publicado_em:
  - decix_rs → decix_rs/ixps.json.gz#ixps
- nome: ixps[ixp].peeringdb
  tipo: dict
  significado: Cadastrados no PeeringDB sem sessão up, sessão up sem cadastro e totais.
  tratamento: "Cadastro e sessão medem coisas diferentes: cadastrado sem sessão pode ser peering bilateral; sessão sem cadastro, desatualização do PeeringDB."
  publicado_em:
  - decix_rs → decix_rs/ixps.json.gz#ixps
- nome: ixps[ixp].comparacao_cidade
  tipo: dict
  significado: Para a cidade do PTT, ASNs diretos do IX.br e do DE-CIX, interseção, só em cada um, ASNs com sessão no DE-CIX e sem direto no IX.br, e o Equinix cadastrado (São Paulo).
  tratamento: 'Critérios diferentes entre as redes (sessão, primeiro salto, cadastro): compara conjuntos de ASNs, não tráfego nem qualidade.'
  publicado_em:
  - decix_rs → decix_rs/ixps.json.gz#ixps
- nome: bloqueio
  tipo: dict
  significado: Presente quando a coleta parou por sinal de bloqueio do servidor (403, 429 ou conexão derrubada).
  publicado_em:
  - decix_rs → decix_rs/ixps.json.gz#bloqueio
- nome: snapshot_date / generated_at / coletado_em / rotas_coletadas_em / fonte / versao_alice / aviso
  tipo: str
  significado: Data do snapshot, instantes UTC de geração e das coletas, fonte, versão do Alice e o aviso sobre o que o dado é.
  publicado_em:
  - decix_rs → decix_rs/ixps.json.gz#snapshot_date
  - decix_rs → decix_rs/ixps.json.gz#generated_at
  - decix_rs → decix_rs/ixps.json.gz#coletado_em
  - decix_rs → decix_rs/ixps.json.gz#rotas_coletadas_em
  - decix_rs → decix_rs/ixps.json.gz#fonte
  - decix_rs → decix_rs/ixps.json.gz#versao_alice
  - decix_rs → decix_rs/ixps.json.gz#aviso
