# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: outorgas
nome: Outorgas Anatel (SCM, SMP, STFC, SeAC) e mapas
descricao: Quatro arquivos de outorgas, cada um com lista, índice por CNPJ, vínculo CNPJ↔ASN, bloco SICI
  resumido e coordenadas; mais os mapas GeoJSON.
modulo: publish.snapshot_builder
entradas:
- source: anatel_scm
- source: anatel_seac
- source: anatel_smp
- source: anatel_stfc
- source: scm_geo
- source: seac_geo
- source: smp_geo
- source: stfc_geo
- source: registro_br
- source: anatel_sici
chaves_de_juncao:
- cnpj
- asn
- uf
- ibge
saidas:
  publicado:
  - scm.json.gz
  - seac.json.gz
  - smp.json.gz
  - stfc.json.gz
  - maps/scms.geojson
  - maps/seacs.geojson
  - maps/smps.geojson
  - maps/stfcs.geojson
campos:
- nome: scms[].asns
  tipo: list[int]
  significado: ASNs vinculados ao CNPJ pelo Registro.br.
  publicado_em:
  - outorgas → scm.json.gz#scms
- nome: scms[].sici_ativo / sici_mes_referencia / sici_acessos / sici_pf / sici_pj
  tipo: bool|str|int
  significado: Resumo do SICI do CNPJ copiado para a outorga.
  tratamento: Sem soma por ASN; um CNPJ com vários ASNs não deve ser somado duas vezes.
  publicado_em:
  - outorgas → scm.json.gz#scms
- nome: scms[].sici_municipios / sici_capacidade_mbps / sici_tecnologia / sici_empresa
  tipo: int|float|str
  significado: Municípios atendidos, capacidade contratada, tecnologia predominante e nome no SICI.
  publicado_em:
  - outorgas → scm.json.gz#scms
- nome: matched_asns / cnpj_to_asns
  tipo: int / dict
  significado: Quantidade de CNPJs ligados a ASN e o mapa CNPJ→ASNs.
  publicado_em:
  - outorgas → scm.json.gz#cnpj_to_asns
- nome: snapshot_date
  tipo: str
  significado: Data do snapshot (AAAA-MM-DD) a que o arquivo pertence.
  publicado_em:
  - outorgas → scm.json.gz#snapshot_date
- nome: generated_at
  tipo: str
  significado: Instante UTC em que o arquivo foi gerado.
  publicado_em:
  - outorgas → scm.json.gz#generated_at
- nome: total
  tipo: int
  significado: Quantidade de registros de outorga.
  publicado_em:
  - outorgas → scm.json.gz#total
- nome: unique_cnpjs
  tipo: int
  significado: CNPJs distintos.
  publicado_em:
  - outorgas → scm.json.gz#unique_cnpjs
- nome: matched_asns
  tipo: int
  significado: CNPJs com ASN vinculado.
  publicado_em:
  - outorgas → scm.json.gz#matched_asns
- nome: scms
  tipo: list[dict]
  significado: Registros de outorga SCM (um por CNPJ/endereço).
  publicado_em:
  - outorgas → scm.json.gz#scms
- nome: by_cnpj
  tipo: dict
  significado: Índice CNPJ → registros de outorga.
  publicado_em:
  - outorgas → scm.json.gz#by_cnpj
- nome: cnpj_to_asns
  tipo: dict
  significado: CNPJ → ASNs do Registro.br.
  publicado_em:
  - outorgas → scm.json.gz#cnpj_to_asns
- nome: snapshot_date
