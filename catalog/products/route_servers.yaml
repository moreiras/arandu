# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: route_servers
nome: Route servers do IX.br, sessões × cadastro
descricao: 'Por PTT do IX.br: estado dos route servers, sessões BGP dos membros (up e down), membros cadastrados com e sem sessão e membros com todas as
  sessões down há 7 dias ou mais. Por ASN: as sessões em cada PTT, com família, estado, há quantos dias, último erro, rotas e uso do limite de importação.
  Fatos medidos no route server na data da coleta, sem veredito.'
modulo: products.route_servers.build
entradas:
- source: ixbr_alice
- source: ixbr_api
chaves_de_juncao:
- ixp
- asn
saidas:
  publicado:
  - route_servers/ixps.json.gz
  - route_servers/asns.json.gz
campos:
- nome: ixps[ixp].resumo
  tipo: dict
  significado: Route servers (total, consultados, com cache de rotas pronto e com vizinhos atuais), membros cadastrados com e sem sessão, sessões sem cadastro, sessões up e down, membros down e perto do limite.
  tratamento: Medição no route server na data da coleta; "cadastrado sem sessão" pode ser membro com peering bilateral.
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#ixps
- nome: ixps[ixp].membros[]
  tipo: list
  significado: Por ASN do PTT (cadastrado ou com sessão), contagem de sessões up e down, maior tempo de queda e maior uso do limite de importação.
  tratamento: "membro down = todas as sessões down há 7 dias ou mais e nenhuma sem frescor confirmado (rs_incerto: cache de vizinhos do Alice com mais de 24 h, sem cached_at ou consulta que falhou); perto do limite = rotas recebidas em 80% ou mais do import_limit."
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#ixps
- nome: asns[asn].ixps[ixp].lista
  tipo: list
  significado: Cada sessão do ASN no PTT (route server, família, estado, dias no estado, último erro, rotas e limite).
  tratamento: Dado do route server; o motivo da queda é o que o Alice reporta, sem causa atribuída.
  publicado_em:
  - route_servers → route_servers/asns.json.gz#asns
- nome: snapshot_date
  tipo: str
  significado: Data do snapshot em que o artefato foi gerado.
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#snapshot_date
  - route_servers → route_servers/asns.json.gz#snapshot_date
- nome: generated_at
  tipo: str
  significado: Instante UTC em que o artefato foi gerado.
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#generated_at
  - route_servers → route_servers/asns.json.gz#generated_at
- nome: coletado_em
  tipo: str
  significado: "Instante UTC da coleta no Alice-LG: a data do dado (o snapshot só o guarda)."
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#coletado_em
  - route_servers → route_servers/asns.json.gz#coletado_em
- nome: fonte
  tipo: str
  significado: Fonte das sessões (Alice-LG do IX.br).
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#fonte
  - route_servers → route_servers/asns.json.gz#fonte
- nome: versao_alice
  tipo: str
  significado: Versão do Alice-LG que respondeu.
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#versao_alice
  - route_servers → route_servers/asns.json.gz#versao_alice
- nome: dias_down
  tipo: str
  significado: Dias de queda a partir dos quais um membro com todas as sessões down conta como membro down (7).
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#dias_down
  - route_servers → route_servers/asns.json.gz#dias_down
- nome: uso_limite
  tipo: str
  significado: Fração do limite de importação (rotas recebidas ÷ import_limit) a partir da qual a sessão está perto do limite (0,8).
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#uso_limite
  - route_servers → route_servers/asns.json.gz#uso_limite
- nome: idade_max_vizinhos_h
  tipo: int
  significado: Idade máxima, em horas, do cache de vizinhos do Alice (cached_at) para as sessões de um route server valerem como estado atual (24).
  publicado_em:
  - route_servers → route_servers/ixps.json.gz#idade_max_vizinhos_h
  - route_servers → route_servers/asns.json.gz#idade_max_vizinhos_h
