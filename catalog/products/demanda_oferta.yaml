# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: demanda_oferta
nome: Demanda × oferta de banda larga fixa
descricao: Cruza a proporção de domicílios com banda larga fixa (TIC Domicílios, estimativa do Arandurapé) com os domicílios projetados do IBGE e os acessos
  fixos de pessoa física do SICI, por UF, grande região e Brasil, com razão, mercado não visto e intervalo de 95%.
modulo: products.demanda_oferta.build
entradas:
- source: cetic_tic_domicilios_microdados
- source: ibge_censo_pnad
- source: anatel_sici
chaves_de_juncao:
- uf
saidas:
  publicado:
  - mercado/demanda_oferta.json.gz
campos:
- nome: ufs[uf] / regioes[região] / brasil
  tipo: dict
  significado: Por grupo, domicílios projetados, proporção com banda larga fixa (TIC) e margem, demanda estimada, acessos de pessoa física (SICI), razão com limites,
    mercado não visto com limites e a classe.
  tratamento: ESTIMATIVA do Arandurapé. Denominador do IBGE tratado como fixo; a margem vem só da amostra da TIC e é menor que a oficial. Grupo suprimido ou de precisão baixa é indeterminado.
  publicado_em:
  - demanda_oferta → mercado/demanda_oferta.json.gz#ufs
  - demanda_oferta → mercado/demanda_oferta.json.gz#regioes
  - demanda_oferta → mercado/demanda_oferta.json.gz#brasil
- nome: tic_edicao / mes_referencia_sici / pnad_ano
  tipo: int / str / str
  significado: Período de referência de cada fonte (a pesquisa, o SICI e a projeção de domicílios não são do mesmo mês).
  publicado_em:
  - demanda_oferta → mercado/demanda_oferta.json.gz#tic_edicao
  - demanda_oferta → mercado/demanda_oferta.json.gz#mes_referencia_sici
  - demanda_oferta → mercado/demanda_oferta.json.gz#pnad_ano
- nome: limites / formulas / intervalo / natureza / fonte
  tipo: str / dict
  significado: Texto das limitações, as fórmulas, o nível do intervalo e o rótulo de natureza do número.
  publicado_em:
  - demanda_oferta → mercado/demanda_oferta.json.gz#limites
  - demanda_oferta → mercado/demanda_oferta.json.gz#formulas
  - demanda_oferta → mercado/demanda_oferta.json.gz#intervalo
  - demanda_oferta → mercado/demanda_oferta.json.gz#natureza
  - demanda_oferta → mercado/demanda_oferta.json.gz#fonte
limites: 'Cruza declaração (SICI, sem erro amostral) com estimativa amostral (TIC Domicílios): a classe sai do intervalo de
  95% da razão e fica `indeterminado` com CV acima de 30%. Diferença entre demanda e oferta é divergência entre fontes com
  definições e períodos diferentes, não erro nem omissão das prestadoras.'
