# Catálogo do Arandurapé. Edite aqui; `python3 scripts/gen_docs.py` regenera docs/.
id: cadastro_empresas
nome: Cadastro das empresas de telecom (Receita Federal) cruzado com o SICI
descricao: 'Por operadora (raiz de CNPJ): matriz, estabelecimentos ativos e baixados, porte, Simples e MEI e a presença física por município (onde há estabelecimento ativo × onde a empresa declara acessos no SICI). Do mercado: entradas e baixas de empresas de telecom por ano e UF, empresas ativas por UF e porte. Fato cadastral da Receita na data do dump mensal; o cruzamento com o SICI não prova atendimento.'
modulo: products.cadastro_empresas.build
entradas:
- source: receita_cnpj
- source: anatel_scm
- source: anatel_smp
- source: anatel_stfc
- source: anatel_seac
- product: sici
chaves_de_juncao:
- cnpj
- ibge
saidas:
  publicado:
  - empresas/cadastro.json.gz
  - empresas/operadoras/{NN}.json.gz
campos:
- nome: operadoras[raiz].matriz / estabelecimentos
  tipo: dict
  significado: Matriz (CNPJ, UF, município, situação, início da atividade, CNAE) e contagem de estabelecimentos (total, ativos, baixados, filiais ativas) da raiz de CNPJ.
  tratamento: Fato do cadastro da Receita na data do dump mensal; empresário individual sem razão social nem nome fantasia.
  publicado_em:
  - cadastro_empresas → empresas/operadoras/{NN}.json.gz#operadoras
- nome: operadoras[raiz].presenca[] / resumo_presenca
  tipo: lista
  significado: Por município, estabelecimentos (total e ativos), se tem a matriz e os acessos fixo e móvel que a empresa declara no SICI; resumo de onde há os dois, só um ou só o outro.
  tratamento: Duas fontes que medem coisas diferentes (sede e filiais × assinantes); a diferença não prova que a empresa atende ou deixou de atender o município.
  publicado_em:
  - cadastro_empresas → empresas/operadoras/{NN}.json.gz#operadoras
- nome: mercado.entradas_por_ano[] / baixas_por_ano[]
  tipo: lista
  significado: Empresas de telecom (matriz com CNAE 61 principal) abertas e baixadas por ano, no total e por UF.
  tratamento: Uma contagem por empresa (a matriz); não separa operadora de revenda ou de MEI.
  publicado_em:
  - cadastro_empresas → empresas/cadastro.json.gz#mercado
- nome: mercado.ativas_por_uf / ativas_por_porte
  tipo: dict
  significado: Empresas de telecom ativas no dump, por UF e por porte (micro, pequeno, demais, MEI).
  publicado_em:
  - cadastro_empresas → empresas/cadastro.json.gz#mercado
- nome: resumo / limites
  tipo: dict
  significado: Empresas no recorte, operadoras com e sem cadastro, estabelecimentos sem casamento com o IBGE e os limites do cruzamento.
  publicado_em:
  - cadastro_empresas → empresas/cadastro.json.gz#resumo
limites: Cadastro na data do dump mensal; recorte de telecom (outorgas, SICI e CNAE 61); município por nome e UF; sem e-mail, telefone, rua nem CEP.
