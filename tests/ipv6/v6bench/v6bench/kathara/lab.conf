LAB_NAME="v6bench"
LAB_DESCRIPTION="V6Bench IPv4/IPv6 connectivity benchmark"
LAB_VERSION="0.1"

# --------------------------------------------------
# Internal LAN
# --------------------------------------------------

gateway[0]="LAB"
nat64[0]="LAB"
siit[0]="LAB"
dns[0]="LAB"

dual_client[0]="LAB"
ipv4_client[0]="LAB"
ipv6_strict_client[0]="LAB"
ipv6_nat64_client[0]="LAB"

# --------------------------------------------------
# Images
# --------------------------------------------------

gateway[image]="kathara/base"
nat64[image]="v6bench/translator:local"
siit[image]="v6bench/translator:local"
dns[image]="kathara/bind"

dual_client[image]="v6bench/client:local"
ipv4_client[image]="v6bench/client:local"
ipv6_strict_client[image]="v6bench/client:local"
ipv6_nat64_client[image]="v6bench/client:local"

# --------------------------------------------------
# IPv6
# --------------------------------------------------

gateway[ipv6]="true"
nat64[ipv6]="true"
siit[ipv6]="true"
dns[ipv6]="true"

dual_client[ipv6]="true"
ipv4_client[ipv6]="false"
ipv6_strict_client[ipv6]="true"
ipv6_nat64_client[ipv6]="true"

# --------------------------------------------------
# IPs
# --------------------------------------------------

gateway[env]="IPv6_ADDR=2001:db8:1::1/64"
nat64[env]="IPv6_ADDR=2001:db8:1::64/64"
siit[env]="IPv6_ADDR=2001:db8:1::46/64"
dns[env]="IPv6_ADDR=2001:db8:1::53/64"
gateway[env]="IPv4_ADDR=192.168.0.1/24"
nat64[env]="IPv4_ADDR=192.168.0.64/24"
siit[env]="IPv4_ADDR=192.168.0.46/24"
dns[env]="IPv4_ADDR=192.168.0.53/24"

dual_client[env]="IPv6_ADDR=2001:db8:1::10/64"
dual_client[env]="IPv4_ADDR=192.168.0.10/24"
ipv4_client[env]="IPv4_ADDR=192.168.0.40/24"
ipv6_strict_client[env]="IPv6_ADDR=2001:db8:1::60/64"
ipv6_nat64_client[env]="IPv6_ADDR=2001:db8:1::664/64"

# --------------------------------------------------
# Device_specific Settings
# --------------------------------------------------
# No privileged mode, no kernel modules and no blocking entrypoints: the
# translators use TAYGA on a TUN device created with mknod, forwarding is set
# here through [sysctl], and run_lab.sh runs test_runner.sh in each client with
# "kathara exec", so the whole lab starts without root.

# gateway
gateway[bridged]="true"
gateway[env]="IS_GATEWAY=true"
gateway[sysctl]="net.ipv4.ip_forward=1"
gateway[sysctl]="net.ipv6.conf.all.forwarding=1"

# nat64
nat64[sysctl]="net.ipv4.ip_forward=1"
nat64[sysctl]="net.ipv6.conf.all.forwarding=1"

# siit
siit[sysctl]="net.ipv4.ip_forward=1"
siit[sysctl]="net.ipv6.conf.all.forwarding=1"

# Scenario subdomains each client tests
dual_client[env]="SDOMS=dual ipv4 ipv6"
ipv4_client[env]="SDOMS=dual ipv4 siit"
ipv6_strict_client[env]="SDOMS=dual ipv6"
ipv6_nat64_client[env]="SDOMS=ipv4 ipv6"
