# Overrides para produção com infraestrutura externa (nginx já existente no host)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   (docker-compose.yml = cópia do docker-compose.exemplo.yml)

services:
  api:
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # chave de MCP: a API publica o estado em /api/v1/limites e escolhe o corpo do 429; quem aplica a cota é o MCP (mesmos valores nos dois)
      - MCP_KEY_ATIVA=${MCP_KEY_ATIVA:-}
      - MCP_COTA_DIARIA=${MCP_COTA_DIARIA:-}
      # Limita arenas do glibc malloc: o ThreadPoolExecutor do Store (até 8 threads)
      # cria uma arena por thread e a fragmentação não volta ao SO.
      - MALLOC_ARENA_MAX=2
      # Byte-cache das respostas do latest (soma dos corpos, em bytes) e teto por entrada.
      - LATEST_CACHE_MAX_BYTES=${LATEST_CACHE_MAX_BYTES:-629145600}
      - LATEST_CACHE_MAX_ENTRY_BYTES=${LATEST_CACHE_MAX_ENTRY_BYTES:-16777216}
      # LRUs do Store (nº de entradas). _origin_paths é o mais pesado (AS-paths de
      # um IXP inteiro por entrada) — só aumentar depois de medir o anon do cgroup.
      - STORE_ORIGIN_PATHS_LRU=${STORE_ORIGIN_PATHS_LRU:-24}
      - STORE_IXP_PEERS_LRU=${STORE_IXP_PEERS_LRU:-24}
      - STORE_MAP_RECORTE_LRU=${STORE_MAP_RECORTE_LRU:-32}
    deploy:
      resources:
        limits:
          cpus: "1"
          # 6G (era 9G): a guarda de memória (api/memoria.py) expurga datas antigas a 80% e tudo a 90% do teto, e o aquecimento fica em
          # ~4,2 GiB. Os 9G vinham de um OOM a 7 GiB, antes da guarda, quando os caches por data não tinham expurgo. Somas dos tetos:
          # ver o comentário de memswap_limit em docker-compose.exemplo.yml.
          memory: ${API_MEM_LIMIT:-6g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mcp:
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    deploy:
      resources:
        limits:
          cpus: "1"
          # Carrega os mesmos dados do snapshot que a API: 4,4 GiB com todas as tools numa data (medido em 2026-11-18). Ver docker-compose.yml.
          memory: ${MCP_MEM_LIMIT:-5g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    environment:
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: ${WORKER_MEM_LIMIT:-3g}   # pico medido 2,4 GiB (data/ops/mem/, rodada semanal de 2026-11-13); nunca junto com o Routinator
    profiles: ["worker"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
