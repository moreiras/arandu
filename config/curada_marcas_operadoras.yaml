# Tabela CURADA marca → raiz do CNPJ. Usada também pelo Consumidor.gov.br.
#
# O RQUAL e as reclamações da Anatel identificam a empresa pelo NOME (a coluna "Marca" ou "Prestadora"), não pelo CNPJ. Esta tabela liga o nome à raiz do CNPJ (8 dígitos: matriz e
# filiais) usando só dados públicos: a razão social e o nome fantasia das outorgas da Anatel (SCM, SMP, STFC, SeAC) e os grupos do SICI que o Arandurapé já publica. Nada de dado de pessoa
# física. Marca que não está aqui nem casa por nome fantasia único (regra automática, rotulada "automático") fica SEM CNPJ: a contagem aparece como "marca sem CNPJ", nunca atribuída
# por palpite. Uma marca pode ter várias raízes (grupo econômico). Correções: arandurape@internetbitabit.com.br.
#
# Campos: `marca` (como na fonte, em maiúsculas), `raizes` (lista de 8 dígitos), `base` (o que sustenta o vínculo), `data` (opcional: quando a linha foi conferida; sem ela vale
# `curada_em`). A comparação ignora acento, caixa e pontuação.
#
# A mesma tabela alimenta o vínculo ASN ↔ CNPJ (decisão D5): uma operadora cuja raiz está numa marca recebe, com o rótulo `marca` e selo inferido, os ASNs das outras
# raízes da marca (a Client Co, raiz 53420564, recebe os ASNs da Oi S.A., raiz 76535764). Ver `asns_estrangeiros` no fim do arquivo.
versao: 2
curada_em: 2026-11-07
fonte_da_curadoria: razão social e nome fantasia das outorgas da Anatel (snapshot 2026-11-05) e grupos do SICI do Arandurapé
