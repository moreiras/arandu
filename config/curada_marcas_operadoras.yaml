# ASNs de fora do Brasil ligados a uma operadora brasileira pela marca (vínculo `estrangeiro` do índice ASN ↔ CNPJ, decisão D5). A operadora declara ao SICI com CNPJ
# brasileiro e a rede que a atende é de AS registrado em outro país, sem CNPJ: o vínculo é inferido da marca e sai com rótulo próprio ("AS estrangeiro"), nunca somado
# aos números de rede da operadora. Cada linha: `marca`, `raizes` (da operadora brasileira), `asns`, `base` e `data` (todos obrigatórios).
