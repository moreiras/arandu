# Rotas da API escritas à mão (não nascem de capacidade declarada) e como cobrem o MCP.
# Cada rota GET não deprecated tem de estar aqui ou em serve/capabilities/<entidade>.yaml: `mcp:` (tool, ou query:<collection>) ou `sem_mcp:`
# (justificativa). A interface é detectada no código do frontend; `sem_ui:` justifica a ausência.
# A matriz gerada fica em docs/cobertura.md (python3 scripts/gen_cobertura.py).
