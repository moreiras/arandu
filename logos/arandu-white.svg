<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L7,3.5 z" fill="#1e40af" opacity="0.80"/>
    </marker>
  </defs>

  <rect width="300" height="360" fill="#ffffff"/>

  <!-- Arestas sem seta -->
  <g stroke="#3b82f6" stroke-width="0.9" fill="none" opacity="0.28">
    <line x1="148" y1="76"  x2="132" y2="218"/>
    <line x1="148" y1="76"  x2="212" y2="152"/>
    <line x1="148" y1="76"  x2="175" y2="108"/>
    <line x1="132" y1="218" x2="212" y2="152"/>
    <line x1="132" y1="218" x2="175" y2="108"/>
    <line x1="212" y1="152" x2="175" y2="108"/>
  </g>

  <!-- Arestas COM seta saindo de Mimosa (β) -->
  <g stroke="#1e40af" stroke-width="1.1" fill="none" opacity="0.65" marker-end="url(#arr)">
    <line x1="65" y1="132" x2="140" y2="81"/>
    <line x1="65" y1="132" x2="124" y2="208"/>
    <line x1="65" y1="132" x2="204" y2="151"/>
    <line x1="65" y1="132" x2="168" y2="110"/>
  </g>

  <!-- α Acrux — maior -->
  <circle cx="132" cy="218" r="9"   fill="#0c1e45"/>

  <!-- β Mimosa — roteador -->
  <circle cx="65"  cy="132" r="7"   fill="#0c1e45"/>

  <!-- γ Gacrux -->
  <circle cx="148" cy="76"  r="5.5" fill="#162d6a"/>

  <!-- δ Delta Crucis -->
  <circle cx="212" cy="152" r="4"   fill="#1e3d8f"/>

  <!-- ε Epsilon Crucis -->
  <circle cx="175" cy="108" r="2.8" fill="#2952b3"/>

  <text
    x="150" y="280"
    font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="28"
    font-weight="300"
    fill="#0c1e45"
    text-anchor="middle"
    letter-spacing="10">ARANDU</text>
</svg>
