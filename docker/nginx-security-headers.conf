# Headers de segurança — incluído no bloco server e em cada location que usa
# add_header (herança de headers é cancelada quando o filho define add_header).
#
# HSTS não está aqui: deve ser adicionado pelo proxy que termina TLS (nginx externo
# ou load balancer), onde max-age e includeSubDomains têm efeito real.

add_header X-Content-Type-Options  "nosniff"                                                  always;
add_header X-Frame-Options         "DENY"                                                      always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"                           always;
add_header Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()"      always;
# CSP: SPA React + MapLibre GL + auth OAuth server-side.
# 'unsafe-inline' em style-src cobre estilos inline do MapLibre e React.
# O basemap dos mapas é auto-hospedado (PMTiles servido por este mesmo nginx
# em /tiles/) — não depende mais de Esri/OSM/demotiles externos, então
# connect-src/img-src não precisam mais liberar esses domínios.
# worker-src: o MapLibre GL 6 carrega o WebWorker de um arquivo da própria origem (/assets/maplibre-gl-worker.mjs); blob: fica
# para workers criados em memória.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
