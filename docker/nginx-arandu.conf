map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limiting de borda (anti-abuso) ──────────────────────────────────────
# Edge real no modo "nginx externo": vê o IP do cliente em $remote_addr. Limite
# VOLUMÉTRICO grosso por IP (barra flood antes do container); os limites finos
# por endpoint ficam no nginx do frontend (limit_req zone=api/mcp).
limit_req_zone  $binary_remote_addr zone=edge:10m     rate=30r/s;
limit_req_zone  $binary_remote_addr zone=edge_mcp:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=edge_mcp_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name arandu.internetbitabit.com.br;

    # ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://arandu.internetbitabit.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arandu.internetbitabit.com.br;

    resolver 127.0.0.11 ipv6=on valid=30s;

    ssl_certificate     /etc/letsencrypt/live/arandu.internetbitabit.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arandu.internetbitabit.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/arandu.access.log;

    set $arandu_upstream arandurape-frontend:80;

    # Servidor MCP (Streamable HTTP). Encaminhado ao frontend, que faz o proxy
    # interno para mcp:8001. Sem buffering e timeout longo para o stream SSE.
    location /mcp {
        # Borda: limite de volume e de streams SSE simultâneos por IP.
        limit_req  zone=edge_mcp burst=20 nodelay;
        limit_conn edge_mcp_conn 8;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_pass http://$arandu_upstream;
    }

    location / {
        # Borda: limite volumétrico grosso por IP (estáticos + API + SPA). Os
        # limites finos por endpoint ficam no nginx do frontend.
        limit_req zone=edge burst=60 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_read_timeout 120;
        proxy_send_timeout 120;

        # Buffers maiores para respostas JSON grandes (/api/v1/asns/names ~3MB)
        proxy_buffer_size       16k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;

        proxy_pass http://$arandu_upstream;
    }
}
