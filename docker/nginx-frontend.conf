map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache em disco das respostas da API (2ª camada, à frente do cache em memória da API).
# keys_zone fica em RAM (~10 MB de chaves); os corpos vão para disco (até 2 GB).
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=2g inactive=7d use_temp_path=off;

# Compressão. Quem aceita brotli recebe a resposta da API SEM compressão e o nginx a comprime
# em brotli; os demais continuam com o gzip da própria API (byte-cache
# da API, sem CPU no nginx). A variante entra na chave do proxy_cache (api-proxy.inc) para não misturar corpos.
map "$arg_v:$http_accept_encoding" $api_ae {
    default       $http_accept_encoding;
    # camada estática por hash (`?v=` de 16 hex): a API entrega o brotli-11 pré-comprimido (api/precompressao.py, `rdap`) ou, enquanto ele
    # não existe, a resposta sem compressão (marcada X-Accel-Expires: 0) que o nginx comprime em nível 6 como nos demais pedidos
    "~*^[0-9a-f]{16}:(.*[ ,])?br([ ,;]|$)" "br";
    "~*(^|[ ,:])br([ ,;]|$)" "";
}

# Agentes que não executam JavaScript (buscadores, prévias de link, assistentes): para as páginas de entidade recebem o HTML mínimo com
# título, descrição e Open Graph que a API monta em /meta/; o navegador comum recebe a SPA de sempre.
map $http_user_agent $agente_de_previa {
    default 0;
    "~*(googlebot|bingbot|duckduckbot|yandexbot|baiduspider|applebot|slackbot|twitterbot|facebookexternalhit|linkedinbot|whatsapp|telegrambot|discordbot|embedly|gptbot|chatgpt-user|oai-searchbot|claudebot|claude-web|perplexitybot)" 1;
}

# Rotas da SPA (primeiro segmento das rotas de frontend/src/main.tsx; `rotas.test.ts` confere a lista). Fora dela o nginx devolve o
# index.html com status 404, e a SPA mostra "Página não encontrada": sem isso toda URL inventada respondia 200 (soft 404).
map $uri $rota_spa {
    default 0;
    /       1;
    "~^/(acessibilidade|ases|asn|bgp|cdncap|cdns|communities|comparar|dados|estados|estatisticas|explorar|fontes|grupo|grupos|inicio-classico|instalacao|instalacoes|ixp|ixp-externo|ixps|localizador|login|mapa|mapa-do-site|mercado-ipv4|mudancas|municipio|municipios|operadora|operadoras|panorama|perfil|prefixo|privacidade|qualidade|rankings|regulatorio|relatorio|scms|seacs|seguranca-de-roteamento|smps|snapshots|sobre|stfcs|uf|uso-aceitavel|uso-da-internet|visao-geral)(/|$)" 1;
}

# Nível 6 (medido no ambiente de teste vs gzip -9 da API): -4% a -14% de bytes em JSON/GeoJSON grandes, ~0,1–0,3 s de CPU por
# resposta de 0,5–1,8 MB. O nível 4 empata ou perde para o gzip -9; o 11 ganha -20% a -28% mas leva 8–16 s por pedido
# (só serve para pré-compressão de conteúdo imutável, não para comprimir na hora).
brotli            on;
brotli_comp_level 6;
brotli_min_length 1024;
brotli_types      application/json application/geo+json application/javascript text/css text/plain
                  image/svg+xml application/manifest+json text/xml application/xml;
# JS/CSS/HTML e JSON estáticos do build para quem não aceita brotli. A API já comprime o que é dela, e o nginx não recomprime resposta que
# chega com Content-Encoding. Sem JSON aqui, quem não manda `br` (curl, bibliotecas, navegador em HTTP) baixaria
# /catalogo.json com 307 KB e /municipios-centroides.json com 164 KB sem compressão (≈ 70 KB e 55 KB em brotli).
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_vary         on;
gzip_types        application/json application/geo+json application/javascript text/css text/plain image/svg+xml application/manifest+json text/xml application/xml;

map $http_x_forwarded_proto $best_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ── Rate limiting (anti-abuso) ───────────────────────────────────────────────
# Este nginx (do container frontend) está SEMPRE no caminho: é o edge na
# instalação integrada (porta 80 publicada) e o proxy interno atrás de um nginx
# externo (overlay no-nginx). Os limites por endpoint vivem aqui para valerem nos
# dois casos. A chave é o IP real do cliente (ver set_real_ip_from no server).
limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=mcp_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;
# Conexões simultâneas por IP em todo o site: um navegador abre até ~6 por HTTP/1.1 ou 1 por
# HTTP/2; 32 deixa folga para NAT de escritório e barra quem segura centenas de conexões lentas. Depende do IP real (real-ip.inc): sem ele
# todos os clientes chegam com o IP do proxy e dividiriam este teto.
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status 429;
limit_conn_status 429;

# Log de acesso com tempos: rt = tempo total da requisição no nginx; urt = tempo de resposta do upstream (API, gate, MCP; "-" quando o
# cache do nginx respondeu); cs = estado do cache. O formato `main` da imagem mais os três campos: dá o tempo do lado do servidor sem
# a rede do cliente (teste de carga, tests/carga/; investigação de lentidão).
log_format temporizado '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time urt=$upstream_response_time cs=$upstream_cache_status';

server {
    listen 8080;
    listen [::]:8080;
    # Redirecionamentos relativos: atrás do túnel (ou de outro proxy) o nginx escuta em 8080 e em HTTP, e um Location absoluto
    # sairia http://<host>:8080/… (vale para os `return 301` e para os que o próprio nginx gera, como a barra final de diretório).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # IP real do cliente. Atrás de um proxy externo (overlay no-nginx) a conexão
    # chega das faixas privadas do Docker; só então confiamos no X-Forwarded-For
    # para identificar o cliente. Na instalação integrada (frontend como edge), o
    # $remote_addr é o IP público do cliente — não casa com estas faixas e é
    # preservado como está, então o limite continua por cliente.
    #
    # Pré-requisito para IPv6: daemon Docker com "userland-proxy": false.
    # Sem isso o docker-proxy mascara o source com o gateway da bridge (fd00:…::1)
    # antes do pacote chegar ao nginx externo — e o IP real some irreversivelmente.
    # Com userland-proxy=false o kernel usa ip6tables DNAT (igual ao IPv4) e o
    # source é preservado.
    # Faixas confiáveis em arquivo próprio: substituível por NGINX_REAL_IP_INC; o padrão não confia na LAN.
    include /etc/nginx/conf.d/real-ip.inc;
    access_log /var/log/nginx/access.log temporizado;

    # Clientes lentos: cabeçalho e corpo em até 10 s, leitura da resposta sem pausa maior que 30 s, keepalive curto.
    limit_conn            conn_ip 32;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # Headers de segurança no bloco server (para locations sem add_header próprio).
    include /etc/nginx/conf.d/security-headers.conf;

    # Proxy para a API (FastAPI no container api:8000)
    #
    # Controle de acesso ANTES do cache: `auth_request` consulta /auth/gate (API)
    # a cada requisição, inclusive as que seriam servidas do cache em disco. Sem
    # isso, um HIT entregaria a resposta a qualquer cliente sem passar pelo guard
    # de sessão anônima (limite de tempo atingido). 204 = segue; 403 = limite.
    location /api/ {
        # Anti-abuso: ~10 req/s por IP com rajada de 20 (cobre o burst de chamadas
        # de uma página do SPA). O slowapi da API reforça rotas caras/sensíveis.
        limit_req          zone=api_limit burst=20 nodelay;

        auth_request       /_gate;
        error_page 401 = @login_required;
        error_page 403 = @anon_limit;
        # Falha do próprio gate (API reiniciando, timeout): fail-open — segue para o
        # proxy/cache normal, que ainda serve respostas antigas (use_stale). O
        # middleware da API continua como defesa em profundidade nos MISS.
        error_page 500 502 503 504 = @api_open;

        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location @api_open {
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Resposta quando o gate nega (limite de sessão anônima atingido). O frontend
    # lê o header X-Anon-Limit-Reached e o campo anon_limit_reached.
    location @anon_limit {
        default_type application/json;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "private, no-store" always;
        add_header X-Anon-Limit-Reached "true" always;
        return 403 '{"detail":"Limite de navegação anônima atingido. Faça login para continuar.","anon_limit_reached":true}';
    }

    # Resposta quando o gate pede login (ação restrita a usuários: expandir lista,
    # histórico, contatos). O frontend abre o modal de login ao ler `login_required`.
    location @login_required {
        default_type application/json;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "private, no-store" always;
        add_header X-Login-Required "true" always;
        return 401 '{"detail":"Esta ação exige login. Faça login para continuar.","login_required":true}';
    }

    # Subrequisição interna do auth_request: só headers (cookie, X-Real-IP e a URI
    # original); sem corpo, sem cache, timeouts curtos.
    location = /_gate {
        internal;
        proxy_pass              http://api:8001/auth/gate;
        proxy_http_version      1.1;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Original-Method $request_method;
        proxy_connect_timeout   1s;
        proxy_read_timeout      2s;
        proxy_cache             off;
    }

    location = /health {
        proxy_pass         http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Sitemaps, robots.txt e llms.txt: gerados pela API com o domínio do .env (SITE_URL).
    location ~ ^/(sitemap(-paginas|-territorio|-entidades)?\.xml|robots\.txt|llms\.txt)$ {
        proxy_pass         http://api:8000$uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # security.txt (RFC 9116): gerado pela API com o contato do .env; na raiz, só o redirecionamento previsto na RFC.
    location = /.well-known/security.txt {
        proxy_pass         http://api:8000$uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
    location = /security.txt { return 301 /.well-known/security.txt; }
    # O resto de /.well-known/ é 404 de verdade (sem isto o SPA respondia 200 com o HTML do site).
    location ^~ /.well-known/ { return 404; }

    # Autenticação OAuth — sem cache, cookies devem passar intactos
    location /auth/ {
        proxy_pass         http://api:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $best_forwarded_proto;
        proxy_cache        off;
        proxy_buffering    off;
    }

    # Servidor MCP (Streamable HTTP no container mcp:8001).
    # Streaming: sem buffering nem cache. O stream servidor→cliente do transporte MCP pode ficar aberto, mas não por uma hora: atrás da
    # Cloudflare a conexão cai em ~100 s de qualquer jeito e o cliente reconecta; 300 s limita o que um IP segura sem proxy na frente.
    location /mcp {
        # Anti-abuso: ~5 req/s por IP (rajada 20) limita o volume de JSON-RPC, e
        # limit_conn restringe streams SSE simultâneos por IP. O app MCP reforça com o orçamento por cliente (conta ou rede /64; api/limites.py).
        limit_req          zone=mcp_limit burst=20 nodelay;
        limit_conn         mcp_conn 8;

        proxy_pass         http://mcp:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $best_forwarded_proto;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Port $server_port;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Basemap vetorial auto-hospedado (PMTiles), servido como arquivo estático
    # em /data/tiles (bind mount somente-leitura — ver docker-compose.exemplo.yml).
    # Cada data é imutável depois de gerada (scripts/build-basemap-tiles.sh);
    # current.json aponta pra qual data está promovida como "atual" e é
    # reescrito por scripts/validate-basemap-tiles.sh / rollback-basemap.sh.
    # Range requests (necessário pro cliente `pmtiles` ler o arquivo em
    # pedaços) já vem habilitado por padrão no nginx para arquivos estáticos.
    # current.json/current.pmtiles são ponteiros (symlink/arquivo reescritos a
    # cada promoção de versão) — nunca cacheáveis como imutáveis, diferente do
    # resto de /tiles/ que é por data e não muda depois de gerado.
    location = /tiles/current.json {
        alias /data/tiles/current.json;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /tiles/current.pmtiles {
        alias /data/tiles/current.pmtiles;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /tiles/ {
        alias /data/tiles/;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }

    # Metatags das entidades: só para os agentes do map $agente_de_previa; sem a API ou sem a entidade, cai na SPA.
    location ^~ /meta/ {
        limit_req              zone=api_limit burst=20 nodelay;
        proxy_pass             http://api:8000;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = /index.html;
    }
    location ~ ^/(asn|ixp|operadora|uf)/[^/]+$ {
        if ($agente_de_previa) { rewrite ^/(.*)$ /meta/$1 last; }
        try_files /index.html =404;
    }

    # SPA fallback: rota conhecida recebe o index.html com 200; desconhecida, o mesmo index.html com 404 (map $rota_spa).
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        error_page 404 /index.html;
        if ($rota_spa = 0) { return 404; }
        rewrite ^ /index.html last;
    }

    # Não cachear index.html
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Módulo JavaScript (.mjs, o WebWorker do MapLibre): o mime.types do nginx não conhece a extensão, e com `nosniff` o navegador
    # recusa um worker servido como application/octet-stream. Também tem hash no nome: cache longo.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }

    # Assets com hash no nome: cache longo
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 1y;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }
}
